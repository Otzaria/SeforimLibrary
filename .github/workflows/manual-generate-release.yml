name: Weekly 5–6/6 · Build, link, validate and publish Seforim DB
run-name: manual-generate-release correlation=${{ inputs.correlation_id }}

# End-to-end build pipeline: builds seforim.db from immutable, digest-pinned
# Sefaria + Otzaria releases, runs the LinkerToOtzaria relink against this
# build's own lines snapshot and injects the resulting LINKER links, then
# packages a split bundle and publishes the lot as a final GitHub release.
# Serial by design: the release always ships a complete link set; a linker
# failure fails the build loudly (requires the PIPELINE_TOKEN secret).
#
# From the second release onwards, the workflow produces a logarithmic
# fan of delta patches against previous releases at fixed offsets
# {1, 2, 4, 8, 16}. A client on any version k within those offsets can
# fetch a *direct* patch; clients further back chain through the
# available anchors. The full bundle remains the fallback.
#
# Anchors auto-discovered from prior release assets — no manual
# operator input needed. db_version is derived as max(prior versions)+1.

on:
  workflow_dispatch:
    inputs:
      runner_selection:
        description: 'בחר על איזה שרת להריץ את הבנייה'
        required: true
        default: 'local'
        type: choice
        options:
          - 'local'
          - 'ARM64'
          - 'server-2'
      prerelease:
        description: |
          Publish as a GitHub pre-release (true) or a final release
          (false, default). Weekly database builds are final releases;
          use true only for an explicitly experimental manual build.
        type: boolean
        required: false
        default: false
      source_commit:
        description: 'Full SeforimLibrary commit selected by the manual-links sync'
        type: string
        required: true
      sefaria_tag:
        description: 'Immutable SefariaExport release tag'
        type: string
        required: true
      sefaria_release_metadata_sha256:
        description: 'Raw SHA-256 of release_metadata.json'
        type: string
        required: true
      sefaria_archive_sha256:
        description: 'SHA-256 of the complete Sefaria archive stream'
        type: string
        required: true
      otzaria_tag:
        description: 'Immutable otzaria-library release tag'
        type: string
        required: true
      otzaria_asset_sha256:
        description: 'Raw SHA-256 of the Otzaria ZIP asset'
        type: string
        required: true
      fordb_archive_sha256:
        description: 'SHA-256 of the pinned ForDB rules archive (fordb_latest.zip)'
        type: string
        required: true
      fordb_tag:
        description: 'Immutable content-addressed ForDB release tag'
        type: string
        required: true
      saga_run_id:
        description: 'Origin sync-manual-links run for event-driven callback (empty for manual use)'
        type: string
        required: false
        default: ''
      saga_run_attempt:
        description: 'Exact attempt of the origin sync-manual-links run (paired with saga_run_id)'
        type: string
        required: false
        default: ''
      expected_links_commit:
        description: 'otzaria-library commit containing refreshed links'
        type: string
        required: true
      otzaria_target_commit:
        description: 'Commit the Otzaria release tag must target'
        type: string
        required: true
      correlation_id:
        description: 'Exact parent pipeline correlation id'
        type: string
        required: true
      relink_recovery_run_id:
        description: |
          Optional exact successful LinkerToOtzaria relink recovery run. When set,
          rebuild the DB from the pinned inputs but consume this run instead of
          dispatching another GPU session. The run, its failed parent, request id,
          snapshot digest, commit, attempt and artifacts are all verified fail-closed.
        type: string
        required: false
        default: ''

permissions:
  contents: write

# Only one release build at a time. A RAM-backed build dir (see the tmpfs step)
# makes two concurrent runs on the same self-hosted host a memory hazard, and a
# release pipeline should never race itself. Queue rather than cancel — a build
# in flight is expensive (hours) and must not be killed mid-way; queue:max lifts
# GitHub's single-pending slot to a durable queue so a later dispatch can't supersede
# a pending build. (queue:max shipped 2026-05-07; confirm at canary — no lint gate here.)
concurrency:
  group: seforim-manual-release
  cancel-in-progress: false
  queue: max

jobs:
  reconcile:
    name: Reuse a complete build with identical pinned inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      reuse: ${{ steps.lookup.outputs.reuse }}
      release_tag: ${{ steps.lookup.outputs.release_tag }}
      build_provenance_sha256: ${{ steps.lookup.outputs.build_provenance_sha256 }}
      lineage_sha256: ${{ steps.lookup.outputs.lineage_sha256 }}
      config_sha256: ${{ steps.lookup.outputs.config_sha256 }}
      source_links_tree_sha256: ${{ steps.lookup.outputs.source_links_tree_sha256 }}
      packaged_links_tree_sha256: ${{ steps.lookup.outputs.packaged_links_tree_sha256 }}
      assets_json: ${{ steps.lookup.outputs.assets_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Reconciliation is control-plane work.  It must use the validator
          # shipped with this workflow run, not the older payload commit.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate local orchestration boundary contracts
        run: python3 .github/scripts/test_build_provenance.py && python3 .github/scripts/test_otzaria_provenance.py && python3 .github/scripts/test_host_safety.py && python3 .github/scripts/test_manual_release_workflow.py && python3 .github/scripts/test_verify_relink_recovery_snapshot.py
      - name: Validate the complete immutable dispatch contract
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SEFARIA_TAG: ${{ inputs.sefaria_tag }}
          SEFARIA_METADATA_SHA: ${{ inputs.sefaria_release_metadata_sha256 }}
          SEFARIA_ARCHIVE_SHA: ${{ inputs.sefaria_archive_sha256 }}
          OTZARIA_TAG: ${{ inputs.otzaria_tag }}
          OTZARIA_ASSET_SHA: ${{ inputs.otzaria_asset_sha256 }}
          FORDB_TAG: ${{ inputs.fordb_tag }}
          FORDB_ARCHIVE_SHA: ${{ inputs.fordb_archive_sha256 }}
          EXPECTED_LINKS_COMMIT: ${{ inputs.expected_links_commit }}
          OTZARIA_TARGET_COMMIT: ${{ inputs.otzaria_target_commit }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          SAGA_RUN_ID: ${{ inputs.saga_run_id }}
          SAGA_RUN_ATTEMPT: ${{ inputs.saga_run_attempt }}
          RELINK_RECOVERY_RUN_ID: ${{ inputs.relink_recovery_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SEFARIA_TAG" =~ ^[A-Za-z0-9._-]{1,100}$ ]]
          [[ "$SEFARIA_METADATA_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SEFARIA_ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$OTZARIA_TAG" =~ ^[A-Za-z0-9._-]{1,100}$ ]]
          [[ "$OTZARIA_ASSET_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FORDB_ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FORDB_TAG" == "fordb-sha256-$FORDB_ARCHIVE_SHA" ]]
          [[ "$EXPECTED_LINKS_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OTZARIA_TARGET_COMMIT" == "$EXPECTED_LINKS_COMMIT" ]]
          [[ "$CORRELATION_ID" =~ ^sefaria:([1-9][0-9]*):([1-9][0-9]*):([A-Za-z0-9._-]{1,100}):([0-9a-f]{64})$ ]]
          [[ "${BASH_REMATCH[3]}" == "$SEFARIA_TAG" ]]
          [[ "${BASH_REMATCH[4]}" == "$SEFARIA_METADATA_SHA" ]]
          [[ -z "$RELINK_RECOVERY_RUN_ID" || "$RELINK_RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          if [[ -n "$SAGA_RUN_ID" || -n "$SAGA_RUN_ATTEMPT" ]]; then
            [[ "$SAGA_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$SAGA_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          fi
      - name: Find and verify exact provenance
        id: lookup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SEFARIA_TAG: ${{ inputs.sefaria_tag }}
          SEFARIA_METADATA_SHA: ${{ inputs.sefaria_release_metadata_sha256 }}
          SEFARIA_ARCHIVE_SHA: ${{ inputs.sefaria_archive_sha256 }}
          OTZARIA_TAG: ${{ inputs.otzaria_tag }}
          OTZARIA_ASSET_SHA: ${{ inputs.otzaria_asset_sha256 }}
          EXPECTED_LINKS_COMMIT: ${{ inputs.expected_links_commit }}
          OTZARIA_TARGET_COMMIT: ${{ inputs.otzaria_target_commit }}
          FORDB_ARCHIVE_SHA: ${{ inputs.fordb_archive_sha256 }}
          FORDB_TAG: ${{ inputs.fordb_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/provenance-scan"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -s 'add' > "$RUNNER_TEMP/releases.json"
          MATCHES=0
          MATCH_TAG=""
          MATCH_SHA=""
          MATCH_CONFIG_SHA=""
          MATCH_LINEAGE_SHA=""
          MATCH_SOURCE_TREE_SHA=""
          MATCH_PACKAGED_TREE_SHA=""
          MATCH_ASSETS=""
          while IFS=$'\t' read -r release_id tag draft target provenance_id; do
            if [ "$draft" = true ] && [ "$target" = "$SOURCE_COMMIT" ]; then
              echo "::error::Draft/partial release $tag already targets this source commit; recovery requires completing or deleting that draft explicitly."
              exit 1
            fi
            [ "$provenance_id" != "NONE" ] || continue
            file="$RUNNER_TEMP/provenance-scan/$release_id.json"
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$provenance_id" > "$file"
            # Releases created before the current provenance contract can carry a
            # legacy build_provenance.json.  They cannot prove reuse for these
            # pinned inputs, so ignore them; a malformed provenance for this
            # exact source commit remains a hard failure rather than risking a
            # duplicate or partial release.
            if ! python3 .github/scripts/validate_build_provenance.py "$file"; then
              if [ "$target" = "$SOURCE_COMMIT" ]; then
                echo "::error::Release $tag targets this source commit but has invalid build provenance; recover or remove it explicitly."
                exit 1
              fi
              echo "::warning::Skipping legacy release $tag with invalid build provenance"
              continue
            fi
            if jq -e \
              --arg source "$SOURCE_COMMIT" \
              --arg st "$SEFARIA_TAG" --arg sm "$SEFARIA_METADATA_SHA" --arg sa "$SEFARIA_ARCHIVE_SHA" \
              --arg ot "$OTZARIA_TAG" --arg oa "$OTZARIA_ASSET_SHA" \
              --arg ec "$EXPECTED_LINKS_COMMIT" --arg tc "$OTZARIA_TARGET_COMMIT" \
              --arg fd "$FORDB_ARCHIVE_SHA" --arg ft "$FORDB_TAG" \
              '.source_commit==$source and .sefaria_tag==$st and .sefaria_release_metadata_sha256==$sm and
               .sefaria_archive_sha256==$sa and .otzaria_tag==$ot and .otzaria_asset_sha256==$oa and
               .expected_links_commit==$ec and .otzaria_target_commit==$tc and
               .fordb_archive_sha256==$fd and .fordb_tag==$ft' "$file" >/dev/null; then
              test "$draft" = false
              test "$target" = "$SOURCE_COMMIT"
              [[ "$tag" =~ ^v[1-9][0-9]*-[0-9]{14}$ ]]
              encoded_tag="$(jq -rn --arg value "$tag" '$value|@uri')"
              test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$encoded_tag" --jq .object.sha)" = "$SOURCE_COMMIT"
              # GitHub exposes sha256 digests for uploaded release assets. Every
              # payload declared by provenance must exist exactly once and match.
              while IFS=$'\t' read -r name size sha; do
                COUNT=$(jq --argjson id "$release_id" --arg name "$name" '[.[]|select(.id==$id)|.assets[]|select(.name==$name)]|length' "$RUNNER_TEMP/releases.json")
                test "$COUNT" -eq 1
                REMOTE_SIZE=$(jq -r --argjson id "$release_id" --arg name "$name" '.[]|select(.id==$id)|.assets[]|select(.name==$name)|.size' "$RUNNER_TEMP/releases.json")
                REMOTE_DIGEST=$(jq -r --argjson id "$release_id" --arg name "$name" '.[]|select(.id==$id)|.assets[]|select(.name==$name)|.digest' "$RUNNER_TEMP/releases.json")
                test "$REMOTE_SIZE" = "$size"
                test "$REMOTE_DIGEST" = "sha256:$sha"
              done < <(jq -r '.assets[]|[.name,(.size|tostring),.sha256]|@tsv' "$file")
              PROVENANCE_SIZE=$(stat -c %s "$file")
              PROVENANCE_SHA=$(sha256sum "$file" | cut -d' ' -f1)
              REMOTE_PROVENANCE_SIZE=$(jq -r --argjson id "$release_id" '.[]|select(.id==$id)|.assets[]|select(.name=="build_provenance.json")|.size' "$RUNNER_TEMP/releases.json")
              REMOTE_PROVENANCE_DIGEST=$(jq -r --argjson id "$release_id" '.[]|select(.id==$id)|.assets[]|select(.name=="build_provenance.json")|.digest' "$RUNNER_TEMP/releases.json")
              test "$REMOTE_PROVENANCE_SIZE" = "$PROVENANCE_SIZE"
              test "$REMOTE_PROVENANCE_DIGEST" = "sha256:$PROVENANCE_SHA"
              REMOTE_ASSET_COUNT=$(jq --argjson id "$release_id" '.[]|select(.id==$id)|.assets|length' "$RUNNER_TEMP/releases.json")
              EXPECTED_ASSET_COUNT=$(jq '.assets|length + 1' "$file")
              test "$REMOTE_ASSET_COUNT" -eq "$EXPECTED_ASSET_COUNT"
              MATCHES=$((MATCHES+1))
              MATCH_TAG="$tag"
              MATCH_SHA="$PROVENANCE_SHA"
              MATCH_CONFIG_SHA=$(jq -r .config_sha256 "$file")
              MATCH_LINEAGE_SHA=$(jq -r .lineage_sha256 "$file")
              MATCH_SOURCE_TREE_SHA=$(jq -r .source_links_tree_sha256 "$file")
              MATCH_PACKAGED_TREE_SHA=$(jq -r .packaged_links_tree_sha256 "$file")
              MATCH_ASSETS=$(jq -cS \
                --arg name build_provenance.json --argjson size "$PROVENANCE_SIZE" --arg sha "$PROVENANCE_SHA" \
                '.assets + [{name:$name,size:$size,sha256:$sha}] | sort_by(.name)' "$file")
            fi
          done < <(jq -r '.[] | [.id,.tag_name,.draft,.target_commitish,([.assets[]|select(.name=="build_provenance.json")|.id][0]//"NONE")] | @tsv' "$RUNNER_TEMP/releases.json")
          test "$MATCHES" -le 1 || { echo "::error::Multiple complete releases have identical input provenance"; exit 1; }
          if [ "$MATCHES" -eq 1 ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=$MATCH_TAG" >> "$GITHUB_OUTPUT"
            echo "build_provenance_sha256=$MATCH_SHA" >> "$GITHUB_OUTPUT"
            echo "lineage_sha256=$MATCH_LINEAGE_SHA" >> "$GITHUB_OUTPUT"
            echo "config_sha256=$MATCH_CONFIG_SHA" >> "$GITHUB_OUTPUT"
            echo "source_links_tree_sha256=$MATCH_SOURCE_TREE_SHA" >> "$GITHUB_OUTPUT"
            echo "packaged_links_tree_sha256=$MATCH_PACKAGED_TREE_SHA" >> "$GITHUB_OUTPUT"
            echo "assets_json=$MATCH_ASSETS" >> "$GITHUB_OUTPUT"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    name: Build seforim.db + bundle + delta fan, publish release
    needs: reconcile
    if: needs.reconcile.outputs.reuse != 'true'
    runs-on: ${{ inputs.runner_selection == 'local' && fromJSON('["otzaria-db"]') || (inputs.runner_selection == 'server-2' && fromJSON('["self-hosted", "Linux", "X64", "server-2"]') || fromJSON('["self-hosted", "Linux", "ARM64"]')) }}
    # Self-hosted jobs have a five-day execution ceiling.  The split child may legally
    # consume 90m GPU NER + 480m CPU resolution (including lease wait) + 30m publish,
    # after this parent has already spent hours generating the DB.  Keep a full 24h
    # parent ceiling so it cannot die while its exact child is still within contract.
    timeout-minutes: 1440
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Logarithmic anchor offsets — covers ~16 versions back with 5 patches.
      # Older clients chain through the anchors; the full bundle is the
      # ultimate fallback.
      PATCH_OFFSETS: "1 2 4 8 16"

    steps:
      # MUST run before checkout. actions/checkout cleans the workspace with
      # `git clean -ffdx`, which recurses into the (gitignored) build/ dir; if a
      # canceled run left build/ as a tmpfs mountpoint, clean cannot rmdir the
      # mountpoint and checkout fails or hangs. Release any stale mount first.
      - name: Release stale RAM build dir (pre-checkout)
        run: |
          BUILD="$GITHUB_WORKSPACE/build"
          while mountpoint -q "$BUILD"; do
            echo "Stale tmpfs at build/ from a prior run — unmounting before checkout."
            sudo umount "$BUILD" 2>/dev/null || sudo umount -l "$BUILD"
          done

      - name: Checkout SeforimLibrary
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      # Keep control-plane validators/lease helpers on the workflow revision
      # while the payload tree above remains pinned to source_commit.  Without
      # this split, a contract fix pushed after source selection is silently
      # replaced by the old scripts during checkout.
      - name: Checkout immutable pipeline control scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .pipeline-control
          sparse-checkout: |
            .github/scripts
            .github/host
          persist-credentials: false

      # `gh` gives GH_TOKEN precedence over GITHUB_TOKEN. Verify the repository
      # permission exposed for each exact credential before spending hours on the
      # DB. Do not use an intentionally malformed release POST as a write probe:
      # GitHub can return validation status 422 before enforcing authorization,
      # which previously classified read-only credentials as writable. Prefer the
      # cross-repository credential because this pipeline necessarily performs
      # cross-repository handoffs; keep GITHUB_TOKEN as the verified fallback.
      - name: Preflight release write credentials
        env:
          AUTOMATIC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROSS_REPO_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          set -euo pipefail
          probe_contents_write() {
            local token="$1" response="$RUNNER_TEMP/repository-permissions.json" code
            [ -n "$token" ] || return 1
            code=$(curl --silent --show-error --output "$response" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $token" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY")
            [ "$code" = 200 ] && jq -e '.permissions.push == true' "$response" >/dev/null
          }
          automatic_writable=false
          cross_repo_writable=false
          if probe_contents_write "$AUTOMATIC_TOKEN"; then automatic_writable=true; fi
          if probe_contents_write "$CROSS_REPO_TOKEN"; then cross_repo_writable=true; fi
          echo "RELEASE_AUTOMATIC_WRITABLE=$automatic_writable" >> "$GITHUB_ENV"
          echo "RELEASE_CROSS_REPO_WRITABLE=$cross_repo_writable" >> "$GITHUB_ENV"
          if [ "$cross_repo_writable" = true ]; then
            echo 'RELEASE_TOKEN_KIND=cross-repo' >> "$GITHUB_ENV"
          elif [ "$automatic_writable" = true ]; then
            echo 'RELEASE_TOKEN_KIND=automatic' >> "$GITHUB_ENV"
          else
            echo '::error::Neither GITHUB_TOKEN nor PIPELINE_TOKEN can create releases; refusing to start the expensive DB build.'
            exit 1
          fi

      - name: Bootstrap durable cross-repo host lease
        run: >-
          bash .pipeline-control/.github/scripts/bootstrap_host_lock.sh
          .pipeline-control/.github/host/otzaria-pipeline.tmpfiles.conf

      - name: Disk before build
        run: |
          set -euo pipefail
          # Bare `df -h` asks WSL to stat every configured Windows drive and
          # exits nonzero when an optional drive is currently absent.  The DB
          # runner stores its distro and caches on C:, so inspect only the
          # filesystems this build can actually use.
          df -h /
          if [ -d /mnt/c ]; then
            df -h /mnt/c
          fi

      # ─── RAM-backed build dir (tmpfs) ──────────────────────────────────────
      # The DB build is fsync-bound on the OCI network block volume: CPU and RAM
      # sit idle in iowait while SQLite waits on per-commit fsyncs to slow
      # network storage. Backing build/ with a RAM tmpfs removes that stall.
      #
      # Mounted *at* build/ so every path stays byte-identical (build/seforim.db,
      # build/seforim.db.buildstate, build/seforim.db.zst) — the DB generation
      # and the delta/buildstate logic are completely untouched. Keep
      # -PinMemoryDb=false below: file-backed-on-tmpfs is fast *and* avoids the
      # second in-RAM copy that an in-memory DB would add on top of the tmpfs.
      #
      # Guards so a release build never falls and never endangers the other
      # repos' runners that share this host:
      #   • size=16G is a HARD cap — a runaway write fails THIS job cleanly with
      #     ENOSPC instead of OOM-killing the host. Measured peak is ~11.4 GiB
      #     (seforim.db ~7G + seforim.db.zst ~3.5G + buildstate ~0.9G coexist
      #     during the compression step), so 16G leaves comfortable headroom.
      #   • Preflight ABORTS before any work if another Runner.Worker is active
      #     or MemAvailable < 18 GiB — never share the box, never start tight. A
      #     clean abort + rerun beats a mid-build OOM, which is the real "fall".
      #   • A stale mount from a canceled run is released in a pre-checkout step.
      - name: Mount RAM-backed build dir (tmpfs)
        run: |
          set -euo pipefail
          BUILD="$GITHUB_WORKSPACE/build"

          # Take the real cross-repo lease before inspecting or cleaning shared
          # host state.  A completed/cancelled Linker run may have left its NER
          # process group alive; its start-time-bound scope is the only authority
          # to stop it.  Reaping first also makes the memory preflight measure the
          # resources this build will actually have.
          LEASE=/run/lock/otzaria/host-heavy.lock
          test -e "$LEASE" && test -w "$LEASE" || {
            echo "::error::$LEASE must be provisioned mode 0666 (see .github/host/otzaria-pipeline.tmpfiles.conf)"
            exit 1
          }
          echo "HOST_LEASE_STATE=$RUNNER_TEMP/host-lease.json" >> "$GITHUB_ENV"
          python3 .pipeline-control/.github/scripts/host_lease.py start --lock "$LEASE" \
            --state "$RUNNER_TEMP/host-lease.json" --ttl 90000
          python3 .pipeline-control/.github/scripts/reap_linker_ner.py

          # Exclusivity: this host runs three self-hosted runners (SeforimLibrary,
          # otzaria, SefariaExport). A RAM-heavy release build must not share the
          # box — a later spike in a concurrent job could OOM both. Our own job is
          # exactly one Runner.Worker; >1 means another repo's job is active.
          WORKERS=$(pgrep -cf 'Runner.Worker' || true)
          if [ "${WORKERS:-0}" -gt 1 ]; then
            echo "::error::${WORKERS} Runner.Worker processes active — another repo's job is running on this shared host. Refusing to start a RAM-backed build; rerun when the host is idle."
            exit 1
          fi

          # Peak need is ~18 GiB (8 GiB generator heap + ~7 GiB DB on tmpfs +
          # Gradle + base). Demand a near-idle box up front rather than risk a
          # late OOM mid-build.
          AVAIL_KB=$(awk '/MemAvailable/{print $2}' /proc/meminfo)
          echo "MemAvailable: $((AVAIL_KB/1024/1024)) GiB"
          if [ "$AVAIL_KB" -lt $((18*1024*1024)) ]; then
            echo "::error::Only $((AVAIL_KB/1024/1024)) GiB available (<18 GiB). Aborting before work to avoid an OOM."
            exit 1
          fi

          # Mount. uid/gid = the runner user so the build can write without sudo.
          mkdir -p "$BUILD"
          sudo mount -t tmpfs -o size=16G,nr_inodes=1m,uid="$(id -u)",gid="$(id -g)",mode=0755 tmpfs "$BUILD"
          echo "tmpfs mounted on build/:"
          findmnt "$BUILD" || df -h "$BUILD"

      - name: Bridle daemon heaps + generator forks for the 16 GB runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx3g
          kotlin.compiler.execution.strategy=in-process
          generatorHeap=8g
          EOF

      - name: Verify durable Java 25 toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v java
          command -v javac
          java_home="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          java_version="$($java_home/bin/java -XshowSettings:properties -version 2>&1 \
            | awk -F'= ' '/^[[:space:]]*java.version = / {print $2; exit}')"
          [[ "$java_version" == 25 || "$java_version" == 25.* ]] || {
            echo "::error::the durable runner must provide Java 25; found ${java_version:-missing}"
            exit 1
          }
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"
          "$java_home/bin/java" -version

      - name: Verify durable Gradle 9.1.0 toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v gradle
          gradle_version="$(gradle --version | awk '/^Gradle / {print $2; exit}')"
          [ "$gradle_version" = 9.1.0 ] || {
            echo "::error::the durable runner must provide Gradle 9.1.0; found ${gradle_version:-missing}"
            exit 1
          }
          gradle --version

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install DB workflow dependencies
        run: bash .pipeline-control/.github/scripts/install-db-workflow-deps.sh

      # Resolve both source archives by immutable tag and digest before any DB
      # work. No fetcher in the build is allowed to consult /releases/latest.
      - name: Verify pinned lineage and extract exact inputs
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SEFARIA_TAG: ${{ inputs.sefaria_tag }}
          SEFARIA_METADATA_SHA: ${{ inputs.sefaria_release_metadata_sha256 }}
          SEFARIA_ARCHIVE_SHA: ${{ inputs.sefaria_archive_sha256 }}
          OTZARIA_TAG: ${{ inputs.otzaria_tag }}
          OTZARIA_ASSET_SHA: ${{ inputs.otzaria_asset_sha256 }}
          EXPECTED_LINKS_COMMIT: ${{ inputs.expected_links_commit }}
          OTZARIA_TARGET_COMMIT: ${{ inputs.otzaria_target_commit }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          FORDB_ARCHIVE_SHA: ${{ inputs.fordb_archive_sha256 }}
          FORDB_TAG: ${{ inputs.fordb_tag }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::PIPELINE_TOKEN is required for pinned cross-repo downloads"; exit 1; }
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SEFARIA_TAG" =~ ^[A-Za-z0-9._-]{1,100}$ ]]
          [[ "$OTZARIA_TAG" =~ ^[A-Za-z0-9._-]{1,100}$ ]]
          [[ "$EXPECTED_LINKS_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OTZARIA_TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SEFARIA_METADATA_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SEFARIA_ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$OTZARIA_ASSET_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FORDB_ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FORDB_TAG" =~ ^fordb-sha256-[0-9a-f]{64}$ ]]
          [[ "${FORDB_TAG#fordb-sha256-}" == "$FORDB_ARCHIVE_SHA" ]]
          [[ "$CORRELATION_ID" =~ ^sefaria:[0-9]+:[0-9]+:[^:]+:[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git fetch --no-tags origin refs/heads/otzaria:refs/remotes/origin/otzaria
          git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/otzaria
          test "$EXPECTED_LINKS_COMMIT" = "$OTZARIA_TARGET_COMMIT"

          INPUTS="$RUNNER_TEMP/manual-links-inputs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$INPUTS"
          mkdir -p "$INPUTS/sefaria-assets" "$INPUTS/sefaria-extract" "$INPUTS/otzaria-assets" "$INPUTS/otzaria-extract"

          gh release download "$SEFARIA_TAG" -R Otzaria/SefariaExport \
            --pattern release_metadata.json --dir "$INPUTS/sefaria-assets"
          SEFARIA_METADATA="$INPUTS/sefaria-assets/release_metadata.json"
          echo "$SEFARIA_METADATA_SHA  $SEFARIA_METADATA" | sha256sum -c -
          python3 .pipeline-control/.github/scripts/validate-sefaria-release-metadata.py \
            "$SEFARIA_METADATA" "$SEFARIA_TAG" "$SEFARIA_ARCHIVE_SHA"
          : > "$INPUTS/sefaria-archive.tar.zst"
          while IFS=$'\t' read -r name size sha; do
            test "$(basename "$name")" = "$name"
            gh release download "$SEFARIA_TAG" -R Otzaria/SefariaExport \
              --pattern "$name" --dir "$INPUTS/sefaria-assets"
            test "$(stat -c %s "$INPUTS/sefaria-assets/$name")" = "$size"
            echo "$sha  $INPUTS/sefaria-assets/$name" | sha256sum -c -
            cat "$INPUTS/sefaria-assets/$name" >> "$INPUTS/sefaria-archive.tar.zst"
          done < <(jq -r '.archive.parts[] | [.name, (.size|tostring), .sha256] | @tsv' "$SEFARIA_METADATA")
          test "$(stat -c %s "$INPUTS/sefaria-archive.tar.zst")" = "$(jq -r .archive.size "$SEFARIA_METADATA")"
          echo "$SEFARIA_ARCHIVE_SHA  $INPUTS/sefaria-archive.tar.zst" | sha256sum -c -
          tar --use-compress-program=unzstd -xf "$INPUTS/sefaria-archive.tar.zst" -C "$INPUTS/sefaria-extract"
          # The immutable Sefaria archive contract places json/ and schemas/
          # directly at its root.  Do not rediscover that root with `find`: a
          # silent cardinality test made a valid export look corrupt and hid
          # which invariant had failed.
          SEFARIA_EXTRACT_ROOT="$INPUTS/sefaria-extract"
          test -d "$SEFARIA_EXTRACT_ROOT/json" || {
            echo "::error::pinned Sefaria archive is missing root json/"
            exit 1
          }
          test -d "$SEFARIA_EXTRACT_ROOT/schemas" || {
            echo "::error::pinned Sefaria archive is missing root schemas/"
            exit 1
          }
          test -n "$(find "$SEFARIA_EXTRACT_ROOT/json" -type f -name '*.json' -print -quit)" || {
            echo "::error::pinned Sefaria archive root json/ contains no JSON files"
            exit 1
          }
          test -n "$(find "$SEFARIA_EXTRACT_ROOT/schemas" -type f -name '*.json' -print -quit)" || {
            echo "::error::pinned Sefaria archive root schemas/ contains no JSON files"
            exit 1
          }

          gh release download "$OTZARIA_TAG" -R otzaria/otzaria-library \
            --pattern otzaria_release_provenance.json --dir "$INPUTS/otzaria-assets"
          PROVENANCE="$INPUTS/otzaria-assets/otzaria_release_provenance.json"
          python3 .pipeline-control/.github/scripts/validate_otzaria_provenance.py "$PROVENANCE" \
            --expected-target "$EXPECTED_LINKS_COMMIT" \
            --expected-tag "$OTZARIA_TAG" \
            --expected-asset-sha256 "$OTZARIA_ASSET_SHA"
          PROVENANCE_DIGEST="$(gh api \
            "repos/otzaria/otzaria-library/releases/tags/$OTZARIA_TAG" \
            --jq '.assets[] | select(.name=="otzaria_release_provenance.json") | .digest')"
          [[ "$PROVENANCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(sha256sum "$PROVENANCE" | cut -d' ' -f1)" == "${PROVENANCE_DIGEST#sha256:}" ]]
          test "$(jq -r .target_commit "$PROVENANCE")" = "$EXPECTED_LINKS_COMMIT"
          test "$(jq -r .asset.sha256 "$PROVENANCE")" = "$OTZARIA_ASSET_SHA"
          OTZARIA_ASSET_NAME=$(jq -r .asset.name "$PROVENANCE")
          test "$(basename "$OTZARIA_ASSET_NAME")" = "$OTZARIA_ASSET_NAME"
          RELEASE_TARGET=$(gh api \
            "repos/otzaria/otzaria-library/releases/tags/$OTZARIA_TAG" \
            --jq .target_commitish)
          test "$RELEASE_TARGET" = "$OTZARIA_TARGET_COMMIT"
          OTZARIA_TAG_COMMIT=$(gh api "repos/otzaria/otzaria-library/commits/$OTZARIA_TAG" --jq .sha)
          test "$OTZARIA_TAG_COMMIT" = "$OTZARIA_TARGET_COMMIT"
          gh release download "$OTZARIA_TAG" -R otzaria/otzaria-library \
            --pattern "$OTZARIA_ASSET_NAME" --dir "$INPUTS/otzaria-assets"
          test "$(stat -c %s "$INPUTS/otzaria-assets/$OTZARIA_ASSET_NAME")" = "$(jq -r .asset.size "$PROVENANCE")"
          echo "$OTZARIA_ASSET_SHA  $INPUTS/otzaria-assets/$OTZARIA_ASSET_NAME" | sha256sum -c -
          unzip -q "$INPUTS/otzaria-assets/$OTZARIA_ASSET_NAME" -d "$INPUTS/otzaria-extract"
          mapfile -t LINEAGES < <(find "$INPUTS/otzaria-extract" -maxdepth 2 -type f -name manual_links_lineage.json)
          test "${#LINEAGES[@]}" -eq 1
          LINEAGE="${LINEAGES[0]}"
          OTZARIA_EXTRACT_ROOT=$(dirname "$LINEAGE")
          CONFIG="$OTZARIA_EXTRACT_ROOT/manual_links_sync.json"
          test -f "$CONFIG" && test -d "$OTZARIA_EXTRACT_ROOT/links"
          test "$(jq -r .seforim_tool_commit "$LINEAGE")" = "$SOURCE_COMMIT"
          test "$(jq -r .sefaria.tag "$LINEAGE")" = "$SEFARIA_TAG"
          test "$(jq -r .sefaria.release_metadata_sha256 "$LINEAGE")" = "$SEFARIA_METADATA_SHA"
          test "$(jq -r .sefaria.archive.sha256 "$LINEAGE")" = "$SEFARIA_ARCHIVE_SHA"
          jq -e --slurpfile metadata "$SEFARIA_METADATA" \
            '.sefaria.run_id == $metadata[0].run_id and
             .sefaria.run_attempt == $metadata[0].run_attempt and
             .sefaria.archive == $metadata[0].archive' "$LINEAGE" >/dev/null
          test "$(sha256sum "$CONFIG" | cut -d' ' -f1)" = "$(jq -r .config_sha256 "$LINEAGE")"
          test "$(jq -r .target_commit "$PROVENANCE")" = "$OTZARIA_TARGET_COMMIT"
          test "$(jq -r .lineage_sha256 "$PROVENANCE")" = "$(sha256sum "$LINEAGE" | cut -d' ' -f1)"

          python3 - "$OTZARIA_EXTRACT_ROOT/links" "$LINEAGE" <<'PY'
          import hashlib, pathlib, struct, sys
          links, lineage = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          records = []
          for entry in links.iterdir():
              if entry.is_symlink() or not entry.is_file():
                  raise SystemExit(f"non-regular or nested links entry: {entry}")
              digest=hashlib.sha256()
              with entry.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024*1024),b""): digest.update(chunk)
              records.append((f"links/{entry.name}".encode(), entry.stat().st_size, digest.digest()))
          stream = bytearray(b"manual-links-tree-v1\0")
          for path, size, digest in sorted(records, key=lambda row: row[0]):
              stream += struct.pack(">I", len(path)) + path + struct.pack(">Q", size) + digest
          actual = hashlib.sha256(stream).hexdigest()
          import json
          expected = json.loads(lineage.read_text(encoding="utf-8"))["packaged_links_tree_sha256"]
          if actual != expected:
              raise SystemExit(f"packaged links tree mismatch: {actual} != {expected}")
          PY

          # Pin the ForDB rules archive by digest: fetch it once here and verify it
          # against the dispatch-time pin, then hand this exact local file to every
          # ForDB post-process so all three JVMs read byte-identical rules instead of
          # each re-fetching the moving `fordb-latest` tag. Fail closed on any drift.
          FORDB_ARCHIVE="$INPUTS/fordb_latest.zip"
          gh release download "$FORDB_TAG" -R otzaria/otzaria-library \
            --pattern fordb_latest.zip --dir "$INPUTS"
          echo "$FORDB_ARCHIVE_SHA  $FORDB_ARCHIVE" | sha256sum -c -

          {
            echo "SEFARIA_EXTRACT_ROOT=$SEFARIA_EXTRACT_ROOT"
            echo "OTZARIA_EXTRACT_ROOT=$OTZARIA_EXTRACT_ROOT"
            echo "MANUAL_LINKS_LINEAGE=$LINEAGE"
            echo "MANUAL_LINKS_CONFIG=$CONFIG"
            echo "OTZARIA_ASSET_NAME=$OTZARIA_ASSET_NAME"
            echo "FORDB_ARCHIVE=$FORDB_ARCHIVE"
            echo "FORDB_ARCHIVE_SHA=$FORDB_ARCHIVE_SHA"
          } >> "$GITHUB_ENV"

      # ─── Discover prior releases + decide db_version ───────────────────────
      # Tags are `v<dbVersion>-<utcTimestamp>` so version discovery is just
      # a regex on the tag list — no per-release asset fetch needed.
      # The version chain ignores pre vs final: a final release can seed/diff
      # against a pre-release predecessor and vice-versa.
      - name: Auto-discover prior releases
        id: discover
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft|not) | {tagName:.tag_name,isPrerelease:.prerelease,createdAt:.created_at,name:.name} | @json' \
            | jq -sc '.' > all-releases.json
          : > prior-versions.tsv  # cols: db_version<TAB>release_tag
          while IFS= read -r tag; do
            VER=$(echo "$tag" | grep -oE '^v[0-9]+-' | tr -d 'v-' || true)
            [ -n "$VER" ] && echo -e "${VER}\t${tag}" >> prior-versions.tsv
          done < <(jq -r '.[].tagName' all-releases.json)
          sort -k1,1nr -o prior-versions.tsv prior-versions.tsv
          echo "Prior releases (db_version → tag):"
          cat prior-versions.tsv || true

          if [ ! -s prior-versions.tsv ]; then
            echo "No prior release found — this is the first release."
            echo "db_version=1" >> "$GITHUB_OUTPUT"
            echo "has_prev=false" >> "$GITHUB_OUTPUT"
          else
            LAST_VER=$(head -n1 prior-versions.tsv | cut -f1)
            NEXT_VER=$((LAST_VER + 1))
            LAST_TAG=$(head -n1 prior-versions.tsv | cut -f2)
            echo "Most recent: db_version=$LAST_VER tag=$LAST_TAG → this build: db_version=$NEXT_VER"
            echo "db_version=$NEXT_VER" >> "$GITHUB_OUTPUT"
            echo "has_prev=true" >> "$GITHUB_OUTPUT"
            echo "seed_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute release tag (v<dbVersion>-<timestamp>)
        id: release_meta
        run: |
          STAMP=$(date -u +"%Y%m%d%H%M%S")
          TAG="v${{ steps.discover.outputs.db_version }}-${STAMP}"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"

      - name: Seed allocator from offset-1 release
        if: steps.discover.outputs.has_prev == 'true'
        run: |
          set -euo pipefail
          SEED_TAG="${{ steps.discover.outputs.seed_tag }}"
          echo "Seeding allocator from release '$SEED_TAG'"
          mkdir -p build prev-dbs
          gh release download "$SEED_TAG" \
            --pattern 'seforim.db.buildstate' \
            --dir build
          # Buildstate goes where generateSeforimDb expects it.
          ls -lh build/seforim.db.buildstate

      # ─── Build seforim.db (full pipeline) ──────────────────────────────────
      # -PinMemoryDb=false: the Lucene index step otherwise copies the entire
      # ~7 GB seforim.db into a SQLite mode=memory database to speed up reads.
      # On the 16 GB runner that native footprint plus the 8 GB generator heap
      # blows past physical RAM and the kernel OOM-kills the job (surfacing as
      # "The operation was canceled"). Reading the DB from disk keeps the peak
      # bounded; the indexing stays well within budget.
      - name: Generate Seforim Database
        run: |
          # -PlinkerSidecar makes the Sefaria import dump the RefEntry→lineId sidecar
          # this build's LINKER Phase-2 needs (see next step).
          gradle generateSeforimDb \
            -PexportDir="$SEFARIA_EXTRACT_ROOT" \
            -PsourceDir="$OTZARIA_EXTRACT_ROOT" \
            -PreleaseName=${{ steps.release_meta.outputs.release_tag }} \
            -PdbVersion=${{ steps.discover.outputs.db_version }} \
            -PinMemoryDb=false \
            -PlinkerSidecar=$PWD/build/linker_sidecar.tsv \
            -PforDbArchive="$FORDB_ARCHIVE" \
            -PforDbSha256="$FORDB_ARCHIVE_SHA" \
            --no-daemon --stacktrace
          # catalog.pb is no longer produced; drop any stale copy so a dirty
          # self-hosted workspace can't smuggle it into the bundle or a patch.
          rm -f build/catalog.pb

      # ─── Serial linker cycle: snapshot → relink → inject, all IN this build ───
      # The linker's offsets are only valid against THIS build's cleaned line text, so the
      # snapshot must be dumped first, the linker re-links exactly the books it changed
      # (delta — minutes), and Phase-2 injects the fresh artifacts back into this same DB.
      # The published release therefore always carries a COMPLETE link set (no one-cycle lag).
      - name: Dump lines snapshot for the linker
        run: |
          set -euo pipefail
          # The raw snapshot is ~5.7 GB and exists only as zstd input.  Keeping
          # it beside the 7.5 GB DB on the 16 GB tmpfs leaves almost no room for
          # the compressed stream and forces needless swap pressure.  Write the
          # transient raw file to the runner's large disk; retain only its
          # content-addressed compressed handoff in RAM.
          RAW_SNAPSHOT="$RUNNER_TEMP/lines-snapshot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.db"
          rm -f "$RAW_SNAPSHOT"
          trap 'rm -f "$RAW_SNAPSHOT"' EXIT
          gradle :packaging:dumpLines \
            -PseforimDb=$PWD/build/seforim.db \
            -PlinesSnapshot="$RAW_SNAPSHOT" \
            --no-daemon --stacktrace
          zstd -T0 -19 -f -o build/lines_snapshot.db.zst "$RAW_SNAPSHOT"
          # Pin the snapshot handoff: the relink verifies the release asset it downloads
          # against this digest, so it can only link the exact snapshot we produced.
          echo "SNAPSHOT_ZST_SHA256=$(sha256sum build/lines_snapshot.db.zst | cut -d' ' -f1)" >> "$GITHUB_ENV"

      # Publish the ~1 GB snapshot outside Actions artifact storage.  Its tag is
      # content-addressed, so a repeated build either reuses byte-identical content or
      # fails closed; the Linker never resolves a moving "Latest" pointer.  This early
      # pre-release exists before the final DB release and remains available for an
      # exactly correlated recovery after a parent failure.
      - name: Publish immutable snapshot release for the relink run
        env:
          AUTOMATIC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROSS_REPO_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          snapshot=build/lines_snapshot.db.zst
          tag="lines-snapshot-sha256-$SNAPSHOT_ZST_SHA256"
          expected_size=$(stat --format='%s' "$snapshot")
          [ "$expected_size" -le 2147483647 ] || {
            echo "::error::snapshot exceeds GitHub's 2 GiB release-asset limit"
            exit 1
          }
          use_token() {
            case "$1" in
              automatic)
                [ "$RELEASE_AUTOMATIC_WRITABLE" = true ] || return 1
                export GH_TOKEN="$AUTOMATIC_TOKEN"
                ;;
              cross-repo)
                [ "$RELEASE_CROSS_REPO_WRITABLE" = true ] || return 1
                export GH_TOKEN="$CROSS_REPO_TOKEN"
                ;;
              *) return 1 ;;
            esac
            token_kind="$1"
          }
          switch_token() {
            case "$token_kind" in
              automatic) use_token cross-repo ;;
              cross-repo) use_token automatic ;;
              *) return 1 ;;
            esac
          }
          use_token "$RELEASE_TOKEN_KIND" || {
            echo "::error::release credential preflight result is missing or invalid"
            exit 1
          }
          release_state() {
            local out="$RUNNER_TEMP/snapshot-release.json" err="$RUNNER_TEMP/snapshot-release.err"
            if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$out" 2> "$err"; then
              if grep -q 'HTTP 404' "$err"; then echo absent; return 0; fi
              cat "$err" >&2
              return 1
            fi
            python3 - "$out" "$tag" "$SNAPSHOT_ZST_SHA256" "$expected_size" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding="utf-8"))
          all_assets=value.get("assets",[])
          matches=[a for a in all_assets if a.get("name")=="lines_snapshot.db.zst"]
          identity=(value.get("tag_name")==sys.argv[2] and value.get("draft") is False and
                    value.get("prerelease") is True)
          if not identity or len(matches)>1 or len(all_assets)!=len(matches):
              print("conflict")
          elif not matches:
              print("empty")
          else:
              asset=matches[0]
              digest=asset.get("digest")
              if asset.get("size") != int(sys.argv[4]): print("conflict")
              elif digest in (None, ""): print("pending")
              else: print("exact" if digest=="sha256:"+sys.argv[3] else "conflict")
          PY
          }
          ensure_release() {
            local state
            state=$(release_state) || return 1
            case "$state" in
              exact|empty|pending) return 0 ;;
              conflict) echo "::error::conflicting immutable snapshot release $tag"; return 1 ;;
              absent) ;;
              *) echo "::error::unknown snapshot release state: $state"; return 1 ;;
            esac
            if gh release create "$tag" --target "$SOURCE_COMMIT" \
                --title "Immutable Linker snapshot $SNAPSHOT_ZST_SHA256" \
                --notes "Content-addressed lines snapshot for exact weekly Linker handoff." \
                --prerelease; then
              return 0
            fi
            state=$(release_state) || state=query-error
            case "$state" in exact|empty|pending) return 0 ;; conflict) return 1 ;; esac
            switch_token || return 1
            state=$(release_state) || return 1
            case "$state" in
              exact|empty|pending) return 0 ;;
              conflict) return 1 ;;
              absent)
                gh release create "$tag" --target "$SOURCE_COMMIT" \
                  --title "Immutable Linker snapshot $SNAPSHOT_ZST_SHA256" \
                  --notes "Content-addressed lines snapshot for exact weekly Linker handoff." \
                  --prerelease || {
                    state=$(release_state) || return 1
                    case "$state" in exact|empty|pending) return 0 ;; *) return 1 ;; esac
                  }
                ;;
              *) echo "::error::unknown snapshot release state after credential fallback: $state"; return 1 ;;
            esac
          }
          ensure_release
          state=$(release_state)
          if [ "$state" = empty ]; then
            if ! gh release upload "$tag" "$snapshot"; then
              state=$(release_state) || state=query-error
              case "$state" in
                exact|pending) ;;
                conflict) exit 1 ;;
                *)
                  switch_token
                  gh release upload "$tag" "$snapshot"
                  ;;
              esac
            fi
          elif [ "$state" = conflict ]; then
            exit 1
          fi
          verified=false
          for _ in $(seq 1 24); do
            state=$(release_state) || state=query-error
            case "$state" in
              exact) verified=true; break ;;
              conflict|absent|empty) break ;;
            esac
            sleep 5
          done
          [ "$verified" = true ] || {
            echo "::error::snapshot release asset did not settle to the exact size and digest"
            exit 1
          }
          echo "SNAPSHOT_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "Published immutable snapshot release $tag"

      # Trigger the incremental relink on LinkerToOtzaria against THIS snapshot and wait.
      # Serial by design: the DB release depends on the relink succeeding — a linker
      # failure fails this build loudly instead of shipping a DB with silent gaps.
      # Cross-repo dispatch/watch/download needs PIPELINE_TOKEN (PAT), not GITHUB_TOKEN.
      - name: Run LinkerToOtzaria relink on this snapshot (and wait)
        id: relink
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          # Operator toggle (repo variable, no code change to flip): 'local' (default)
          # runs the complete relink on the durable x64/ROCm host. 'kaggle' retains
          # the split fallback and 'server' retains the Oracle fallback.
          SERIAL_LINKER_TARGET: ${{ vars.SERIAL_LINKER_TARGET || 'local' }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          SEFARIA_TAG: ${{ inputs.sefaria_tag }}
          SEFARIA_METADATA_SHA: ${{ inputs.sefaria_release_metadata_sha256 }}
          RECOVERY_RUN_ID: ${{ inputs.relink_recovery_run_id }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::PIPELINE_TOKEN secret is empty or missing on this repo — re-run: gh secret set PIPELINE_TOKEN -R Otzaria/SeforimLibrary"; exit 1; }
          if [ -n "$RECOVERY_RUN_ID" ]; then
            # Explicit recovery is deliberately narrower than normal reuse: accept one
            # exact, already-successful relink-recovery run whose title binds it to one
            # exact failed build attempt with this correlation. The payload manifest is
            # independently checked against its original content-addressed snapshot;
            # any rebuilt-snapshot drift is checked semantically before Phase-2.
            [[ "$RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::relink_recovery_run_id must be a positive integer"; exit 1; }
            RECOVERY_JSON="$RUNNER_TEMP/relink-recovery-run.json"
            gh api "repos/Otzaria/LinkerToOtzaria/actions/runs/$RECOVERY_RUN_ID" > "$RECOVERY_JSON"
            IFS=$'\t' read -r RECOVERY_STATUS RECOVERY_CONCLUSION RECOVERY_EVENT RECOVERY_PATH RECOVERY_ATTEMPT RECOVERY_HEAD RECOVERY_TITLE \
              < <(jq -er '[.status, .conclusion, .event, .path, (.run_attempt|tostring), .head_sha, .display_title] | @tsv' "$RECOVERY_JSON")
            [ -n "$RECOVERY_TITLE" ] || { echo "::error::malformed relink recovery run metadata"; exit 1; }
            [ "$RECOVERY_STATUS" = completed ] && [ "$RECOVERY_CONCLUSION" = success ] || { echo "::error::relink recovery run is not completed:success"; exit 1; }
            [ "$RECOVERY_EVENT" = workflow_dispatch ] && [ "$RECOVERY_PATH" = .github/workflows/relink.yml ] || { echo "::error::relink recovery run has an unexpected event or workflow"; exit 1; }
            [[ "$RECOVERY_ATTEMPT" =~ ^[1-9][0-9]*$ ]] && [[ "$RECOVERY_HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::relink recovery run has malformed attempt or head SHA"; exit 1; }
            if [[ "$RECOVERY_TITLE" =~ ^relink-recovery\ request=([0-9a-f]{64})\ parent=([1-9][0-9]*):([1-9][0-9]*)$ ]]; then
              RELINK_REQUEST_ID="${BASH_REMATCH[1]}"
              EXPECTED_PARENT_RUN_ID="${BASH_REMATCH[2]}"
              EXPECTED_PARENT_RUN_ATTEMPT="${BASH_REMATCH[3]}"
            else
              echo "::error::run $RECOVERY_RUN_ID is not an exactly correlated recovery run"; exit 1
            fi

            PARENT_JSON="$RUNNER_TEMP/relink-recovery-parent.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_PARENT_RUN_ID/attempts/$EXPECTED_PARENT_RUN_ATTEMPT" > "$PARENT_JSON"
            EXPECTED_PARENT_TITLE="manual-generate-release correlation=$CORRELATION_ID"
            jq -e --argjson attempt "$EXPECTED_PARENT_RUN_ATTEMPT" --arg title "$EXPECTED_PARENT_TITLE" '
              .status == "completed" and .conclusion == "failure" and
              .event == "workflow_dispatch" and .path == ".github/workflows/manual-generate-release.yml" and
              .run_attempt == $attempt and .display_title == $title
            ' "$PARENT_JSON" >/dev/null || { echo "::error::recovery parent is not the exact failed build attempt for this correlation"; exit 1; }

            RECOVERY_OUTPUT_TAG="linker-output-${RELINK_REQUEST_ID}-${RECOVERY_ATTEMPT}"
            gh api "repos/Otzaria/LinkerToOtzaria/releases/tags/$RECOVERY_OUTPUT_TAG" --jq \
              '{isDraft:.draft,isPrerelease:.prerelease,targetCommitish:.target_commitish,assets:[.assets[]|{name,size,digest}]}' \
              > "$RUNNER_TEMP/relink-recovery-output-release.json"
            python3 - "$RUNNER_TEMP/relink-recovery-output-release.json" "$RECOVERY_HEAD" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding="utf-8"))
          names={item.get("name") for item in value.get("assets",[])}
          if not (value.get("isDraft") is False and value.get("isPrerelease") is True and
                  value.get("targetCommitish")==sys.argv[2] and
                  names=={"linker_release_pointer.json","relink_manifest.json"}):
              raise SystemExit("recovery Linker output release identity/assets differ")
          PY
            RECOVERY_MANIFEST="$RUNNER_TEMP/relink-recovery-manifest.json"
            rm -f "$RECOVERY_MANIFEST"
            gh release download "$RECOVERY_OUTPUT_TAG" -R Otzaria/LinkerToOtzaria \
              -p relink_manifest.json -O "$RECOVERY_MANIFEST"
            EXPECTED_LINKER_SNAPSHOT_ZST_SHA256="$(jq -er \
              --arg request "$RELINK_REQUEST_ID" --argjson run "$RECOVERY_RUN_ID" \
              --argjson attempt "$RECOVERY_ATTEMPT" --argjson parent "$EXPECTED_PARENT_RUN_ID" \
              --argjson parent_attempt "$EXPECTED_PARENT_RUN_ATTEMPT" '
                select(.schema_version==2 and .relink_request_id==$request and
                       .relink_run_id==$run and .relink_run_attempt==$attempt and
                       .parent_run_id==$parent and .parent_run_attempt==$parent_attempt) |
                .snapshot_zst_sha256 |
                select(type=="string" and test("^[0-9a-f]{64}$"))
              ' "$RECOVERY_MANIFEST")"
            SNAPSHOT_RELEASE_TAG="lines-snapshot-sha256-$EXPECTED_LINKER_SNAPSHOT_ZST_SHA256"
            SNAPSHOT_RELEASE="$RUNNER_TEMP/relink-recovery-snapshot-release.json"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$SNAPSHOT_RELEASE_TAG" > "$SNAPSHOT_RELEASE"
            python3 - "$SNAPSHOT_RELEASE" "$SNAPSHOT_RELEASE_TAG" "$EXPECTED_LINKER_SNAPSHOT_ZST_SHA256" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding="utf-8"))
          all_assets=value.get("assets",[])
          assets=[a for a in all_assets if a.get("name")=="lines_snapshot.db.zst"]
          if not (value.get("tag_name")==sys.argv[2] and value.get("draft") is False and
                  value.get("prerelease") is True and len(all_assets)==len(assets)==1 and
                  assets[0].get("size",0)>0 and assets[0].get("digest")=="sha256:"+sys.argv[3]):
              raise SystemExit("recovery parent snapshot release is missing or not byte-exact")
          PY

            RUN="$RECOVERY_RUN_ID"
            {
              echo "RELINK_REQUEST_ID=$RELINK_REQUEST_ID"
              echo "RELINK_TITLE=$RECOVERY_TITLE"
              echo "KAGGLE_TITLE=kaggle-relink request=$RELINK_REQUEST_ID parent=$EXPECTED_PARENT_RUN_ID:$EXPECTED_PARENT_RUN_ATTEMPT"
            } >> "$GITHUB_ENV"
            {
              echo "run_id=$RUN"
              echo "request_id=$RELINK_REQUEST_ID"
              echo "parent_run_id=$EXPECTED_PARENT_RUN_ID"
              echo "parent_run_attempt=$EXPECTED_PARENT_RUN_ATTEMPT"
            } >> "$GITHUB_OUTPUT"
            echo "Reusing exact successful recovery relink $RUN for failed parent $EXPECTED_PARENT_RUN_ID:$EXPECTED_PARENT_RUN_ATTEMPT"
          else
          # Per-attempt correlation identity: a deterministic sha256 over this exact
          # attempt + the saga correlation + the pinned inputs + the target. A rerun
          # (new attempt) yields a DIFFERENT id, so discovery/cleanup of this attempt
          # can never touch another's runs. Threaded end-to-end: dispatch → both
          # LinkerToOtzaria run-names → relink manifest → build provenance.
          REQUEST_JSON=$(jq -cn \
            --arg schema relink-request-v1 \
            --arg parent_repository "$GITHUB_REPOSITORY" \
            --argjson parent_run_id "$GITHUB_RUN_ID" \
            --argjson parent_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg correlation_id "$CORRELATION_ID" \
            --arg sefaria_tag "$SEFARIA_TAG" \
            --arg sefaria_release_metadata_sha256 "$SEFARIA_METADATA_SHA" \
            --arg snapshot_zst_sha256 "$SNAPSHOT_ZST_SHA256" \
            --arg target "$SERIAL_LINKER_TARGET" \
            '{schema: $schema, parent_repository: $parent_repository,
              parent_run_id: $parent_run_id, parent_run_attempt: $parent_run_attempt,
              correlation_id: $correlation_id, sefaria_tag: $sefaria_tag,
              sefaria_release_metadata_sha256: $sefaria_release_metadata_sha256,
              snapshot_zst_sha256: $snapshot_zst_sha256, target: $target}')
          RELINK_REQUEST_ID=$(printf '%s' "$REQUEST_JSON" | sha256sum | cut -d' ' -f1)
          # Must byte-match the run-name templates in relink.yml / kaggle-relink.yml —
          # every consumer compares the FULL title with ==, never contains.
          export RELINK_TITLE="relink request=$RELINK_REQUEST_ID parent=${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          export KAGGLE_TITLE="kaggle-relink request=$RELINK_REQUEST_ID parent=${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          {
            echo "RELINK_REQUEST_ID=$RELINK_REQUEST_ID"
            echo "RELINK_TITLE=$RELINK_TITLE"
            echo "KAGGLE_TITLE=$KAGGLE_TITLE"
          } >> "$GITHUB_ENV"
          echo "relink request id: $RELINK_REQUEST_ID"
          # The child must run the LinkerToOtzaria main we observe NOW — a push landing
          # mid-dispatch would silently change the engine under our pinned inputs.
          # Capture the expected head + the dispatch time; discovery requires both.
          LINKER_HEAD=$(gh api repos/Otzaria/LinkerToOtzaria/commits/main --jq .sha)
          DISPATCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Owner decision (2026-07-23): the default split path runs only raw NER on
          # Kaggle, then resolves those responses on the Oracle ARM box.  Therefore BOTH
          # targets need the cross-repo host lease released for the entire child lifetime:
          # target=kaggle needs it for the resolver stage, while target=server needs it
          # for the legacy unsplit relink.  Reacquire only after the exact child is
          # terminal, before this build touches the DB again.
          # Inputs reach the dispatch ONLY via env (validated sha/tag shapes at job
          # entry) — nothing raw is interpolated into this script body.
          case "$SERIAL_LINKER_TARGET" in
            local|kaggle|server) ;;
            *) echo "::error::SERIAL_LINKER_TARGET must be 'local', 'kaggle' or 'server', got '$SERIAL_LINKER_TARGET'"; exit 1 ;;
          esac
          # Cleanup may search by exact title only after THIS attempt reached its
          # dispatch boundary.  RELINK_REQUEST_ID is computed earlier and can also be
          # present in an attempt that fails before dispatch; treating that as proof of
          # ownership let a later GitHub rerun cancel an older attempt's live recovery.
          echo "RELINK_DISPATCH_STARTED=1" >> "$GITHUB_ENV"
          python3 .pipeline-control/.github/scripts/host_lease.py release --state "$HOST_LEASE_STATE"
          case "$SERIAL_LINKER_TARGET" in
            local)
              gh workflow run relink.yml -R Otzaria/LinkerToOtzaria \
                -f library_run_id="$GITHUB_RUN_ID" -f target=local \
                -f relink_request_id="$RELINK_REQUEST_ID" \
                -f parent_run_attempt="$GITHUB_RUN_ATTEMPT" \
                -f sefaria_tag="$SEFARIA_TAG" \
                -f snapshot_sha256="$SNAPSHOT_ZST_SHA256" \
                -f sefaria_release_metadata_sha256="$SEFARIA_METADATA_SHA" ;;
            kaggle)
              gh workflow run kaggle-relink.yml -R Otzaria/LinkerToOtzaria \
                -f library_run_id="$GITHUB_RUN_ID" \
                -f relink_request_id="$RELINK_REQUEST_ID" \
                -f parent_run_attempt="$GITHUB_RUN_ATTEMPT" \
                -f sefaria_tag="$SEFARIA_TAG" \
                -f snapshot_sha256="$SNAPSHOT_ZST_SHA256" \
                -f sefaria_release_metadata_sha256="$SEFARIA_METADATA_SHA" ;;
            server)
              gh workflow run relink.yml -R Otzaria/LinkerToOtzaria \
                -f library_run_id="$GITHUB_RUN_ID" -f target=server \
                -f relink_request_id="$RELINK_REQUEST_ID" \
                -f parent_run_attempt="$GITHUB_RUN_ATTEMPT" \
                -f sefaria_tag="$SEFARIA_TAG" \
                -f snapshot_sha256="$SNAPSHOT_ZST_SHA256" \
                -f sefaria_release_metadata_sha256="$SEFARIA_METADATA_SHA" ;;
          esac
          # Identify OUR run: EXACT title equality on the per-attempt request id, exactly
          # one match (two runs sharing a fresh id is a broken invariant — refuse to
          # guess), created at/after our dispatch, at the head we captured. Fully
          # paginated REST over a created>=dispatch window — never "the last N runs"
          # (fresh completed runs cannot push our child out of view) — and the window
          # INCLUDES completed runs, so a child that failed fast is still found (the
          # wait loop below then reports its real conclusion). 20 min budget: the
          # kaggle-relink dispatcher (ubuntu-latest) needs 1-3 min to register the
          # JIT and queue the relink before the run can even appear.
          RUN=""
          for _ in $(seq 1 120); do
            sleep 10
            # A transient listing error just means "retry next round"; the final
            # hard failure below keeps this fail-loud, not fail-open.
            if ! ROWS=$(gh api --paginate -X GET "repos/Otzaria/LinkerToOtzaria/actions/workflows/relink.yml/runs" \
              -f created=">=$DISPATCHED_AT" -f per_page=100 \
              --jq '.workflow_runs[] | select(.display_title == env.RELINK_TITLE) | [(.id|tostring), .head_sha, .created_at] | @tsv'); then
              continue
            fi
            ROWS=$(printf '%s\n' "$ROWS" | awk -F'\t' 'NF && !seen[$1]++')
            N=$(printf '%s' "$ROWS" | grep -c . || true)
            if [ "$N" -gt 1 ]; then
              echo "::error::$N relink runs share request id $RELINK_REQUEST_ID — refusing to guess"; exit 1
            fi
            if [ "$N" -eq 1 ]; then
              IFS=$'\t' read -r RUN RUN_HEAD CREATED <<<"$ROWS"
              if [[ "$CREATED" < "$DISPATCHED_AT" ]]; then
                echo "::error::relink run $RUN was created at $CREATED, before our dispatch at $DISPATCHED_AT — a stale run carries our id"; exit 1
              fi
              if [ "$RUN_HEAD" != "$LINKER_HEAD" ]; then
                echo "::error::relink run $RUN is at $RUN_HEAD but LinkerToOtzaria main was $LINKER_HEAD at dispatch — main moved mid-dispatch; rerun this build"; exit 1
              fi
              break
            fi
          done
          [ -n "$RUN" ] || { echo "::error::relink run ($RELINK_TITLE) never appeared"; exit 1; }
          echo "relink run: $RUN"
          {
            echo "run_id=$RUN"
            echo "request_id=$RELINK_REQUEST_ID"
            echo "parent_run_id=$GITHUB_RUN_ID"
            echo "parent_run_attempt=$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          # Low-frequency resilient wait: `gh run watch` polls every 3s, which can
          # exhaust the shared 5k/hr API quota on an hours-long relink; transient
          # API errors must not kill an otherwise-healthy build. A run stuck in
          # `queued` past 30 min means the Kaggle session never booted (quota,
          # dataset, image drift) — fail loudly instead of burning the job timeout.
          queued_for=0
          while :; do
            state="$(gh api "repos/Otzaria/LinkerToOtzaria/actions/runs/$RUN" --jq '.status + ":" + (.conclusion // "")' 2>"$RUNNER_TEMP/wait-err.txt" || { grep -q "HTTP 401" "$RUNNER_TEMP/wait-err.txt" && echo fatal-auth || echo transient; })"
            case "$state" in
              completed:success) break ;;
              completed:*) echo "::error::relink run $RUN concluded ${state#completed:}"; exit 1 ;;
              fatal-auth) echo "::error::token rejected (HTTP 401) while waiting — dead credentials cannot heal"; exit 1 ;;
              queued:*|pending:*|requested:*|waiting:*)
                # Every pre-start state counts toward the 30-min cap — a run blocked in
                # `pending` on a busy concurrency group is just as stuck as one `queued`.
                queued_for=$((queued_for + 60))
                if [ "$queued_for" -ge 1800 ]; then
                  echo "::error::relink run $RUN still ${state%%:*} after 30 min — never started (Kaggle session or concurrency slot)"; exit 1
                fi
                sleep 60 ;;
              *) queued_for=0; sleep 60 ;;
            esac
          done
          # The exact child is terminal now. Reacquire before this job touches the DB
          # again; if another heavy phase won the race, fail rather than overlap.
          python3 .pipeline-control/.github/scripts/host_lease.py start \
            --lock /run/lock/otzaria/host-heavy.lock \
            --state "$HOST_LEASE_STATE" --ttl 90000
          fi
          : "${EXPECTED_LINKER_SNAPSHOT_ZST_SHA256:=$SNAPSHOT_ZST_SHA256}"
          echo "EXPECTED_LINKER_SNAPSHOT_ZST_SHA256=$EXPECTED_LINKER_SNAPSHOT_ZST_SHA256" >> "$GITHUB_ENV"

      # Inject the payload the relink run just produced into THIS DB. The exact
      # request+attempt pointer names a content-addressed final Linker release; no
      # Actions artifact storage and no moving "latest" pointer are involved.
      # -PlinkerStrict: in the serial cycle every source line must map and hash-match;
      # any stale/unmapped source means broken lineage → fail the build.
      - name: Apply LINKER links (Phase-2)
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          SEFARIA_TAG: ${{ inputs.sefaria_tag }}
          RELINK_RUN_ID: ${{ steps.relink.outputs.run_id }}
          EXPECTED_RELINK_REQUEST_ID: ${{ steps.relink.outputs.request_id }}
          EXPECTED_RELINK_PARENT_RUN_ID: ${{ steps.relink.outputs.parent_run_id }}
          EXPECTED_RELINK_PARENT_RUN_ATTEMPT: ${{ steps.relink.outputs.parent_run_attempt }}
        run: |
          set -euo pipefail
          rm -rf build/linker && mkdir -p build/linker
          RUN_ATTEMPT="$(gh api "repos/Otzaria/LinkerToOtzaria/actions/runs/$RELINK_RUN_ID" --jq .run_attempt)"
          [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          OUTPUT_TAG="linker-output-${EXPECTED_RELINK_REQUEST_ID}-${RUN_ATTEMPT}"
          gh release download "$OUTPUT_TAG" -R Otzaria/LinkerToOtzaria \
            -p linker_release_pointer.json -p relink_manifest.json -D build/linker
          POINTER=build/linker/linker_release_pointer.json
          LINKER_RELEASE_TAG="$(jq -er .release_tag "$POINTER")"
          POINTER_PAYLOAD_SHA="$(jq -er .payload_sha256 "$POINTER")"
          [[ "$LINKER_RELEASE_TAG" =~ ^linker-release-sha256-[0-9a-f]{64}$ ]]
          [[ "$POINTER_PAYLOAD_SHA" =~ ^[0-9a-f]{64}$ ]]
          jq -e --arg request "$EXPECTED_RELINK_REQUEST_ID" --argjson run "$RELINK_RUN_ID" \
            --argjson attempt "$RUN_ATTEMPT" '
              .schema_version==1 and .relink_request_id==$request and
              .relink_run_id==$run and .relink_run_attempt==$attempt
            ' "$POINTER" >/dev/null
          gh release download "$LINKER_RELEASE_TAG" -R Otzaria/LinkerToOtzaria \
            -p linker_links.zst -D build/linker
          REMOTE_PAYLOAD_DIGEST="$(gh api \
            "repos/Otzaria/LinkerToOtzaria/releases/tags/$LINKER_RELEASE_TAG" \
            --jq '.assets[]|select(.name=="linker_links.zst")|.digest')"
          [ "$REMOTE_PAYLOAD_DIGEST" = "sha256:$POINTER_PAYLOAD_SHA" ] || {
            echo "::error::Linker pointer differs from final release payload digest"; exit 1;
          }
          # The relink manifest binds this payload to the exact inputs it was linked
          # against. Verify — fail-closed — that the payload matches its own digest, that
          # the relink used the selected original snapshot, and that it is the run we
          # selected. A recovery rebuild is compared semantically below before Phase-2.
          M=build/linker/relink_manifest.json
          test -f "$M"
          # Payload integrity — an independent cross-file digest check.
          echo "$(jq -r .payload_sha256 "$M")  build/linker/linker_links.zst" | sha256sum -c -
          # The relink run's ACTUAL GitHub identity — not the manifest's self-report.
          RUN_HEAD_SHA="$(gh api "repos/Otzaria/LinkerToOtzaria/actions/runs/$RELINK_RUN_ID" --jq .head_sha)"
          # Strictly validate the manifest before recording anything: exact key set, field
          # types/formats, binding to this build's pinned Sefaria + snapshot, and — crucially —
          # that its self-reported linker_commit / relink_run_attempt EQUAL the relink run's
          # real head_sha / attempt. A forged or drifted manifest fails here, fail-closed.
          MANIFEST="$M" EXP_SEFARIA_TAG="$SEFARIA_TAG" EXP_SNAPSHOT_SHA="$EXPECTED_LINKER_SNAPSHOT_ZST_SHA256" \
          EXP_RUN_ID="$RELINK_RUN_ID" RUN_HEAD_SHA="$RUN_HEAD_SHA" RUN_ATTEMPT="$RUN_ATTEMPT" \
          EXP_REQUEST_ID="$EXPECTED_RELINK_REQUEST_ID" PARENT_RUN_ID="$EXPECTED_RELINK_PARENT_RUN_ID" PARENT_RUN_ATTEMPT="$EXPECTED_RELINK_PARENT_RUN_ATTEMPT" \
          python3 - >> "$GITHUB_ENV" <<'PY'
          import json, os, re, sys
          def _no_dupes(pairs):
              seen = {}
              for k, v in pairs:
                  if k in seen:
                      sys.exit(f"relink manifest: duplicate key {k!r}")
                  seen[k] = v
              return seen
          m = json.load(open(os.environ["MANIFEST"], encoding="utf-8"), object_pairs_hook=_no_dupes)
          if set(m) != {"schema_version", "sefaria_tag", "snapshot_zst_sha256", "engine_fingerprint",
                        "payload_sha256", "linker_commit", "relink_run_id", "relink_run_attempt",
                        "relink_request_id", "parent_run_id", "parent_run_attempt"}:
              sys.exit(f"relink manifest key set mismatch: {sorted(m)}")
          def need(cond, msg):
              if not cond:
                  sys.exit(f"relink manifest: {msg}")
          def s(k):  # value must be a real str (not a number/bool that stringifies)
              return isinstance(m[k], str)
          need(type(m["schema_version"]) is int and m["schema_version"] == 2, "schema_version must be 2")
          # Identity binding: the manifest must echo the selected request id and exact
          # parent coordinates. In recovery mode those are the terminal failed build
          # named by the recovery run, never the new rebuild's coordinates.
          need(s("relink_request_id") and m["relink_request_id"] == os.environ["EXP_REQUEST_ID"], "relink_request_id != this build's request id")
          need(type(m["parent_run_id"]) is int and m["parent_run_id"] == int(os.environ["PARENT_RUN_ID"]), "parent_run_id != this build's run id")
          need(type(m["parent_run_attempt"]) is int and m["parent_run_attempt"] == int(os.environ["PARENT_RUN_ATTEMPT"]), "parent_run_attempt != this build's attempt")
          need(s("sefaria_tag") and m["sefaria_tag"] == os.environ["EXP_SEFARIA_TAG"], "sefaria_tag != this build's pinned tag")
          need(s("snapshot_zst_sha256") and m["snapshot_zst_sha256"] == os.environ["EXP_SNAPSHOT_SHA"], "snapshot_zst_sha256 != this build's snapshot")
          need(s("payload_sha256") and bool(re.fullmatch(r"[0-9a-f]{64}", m["payload_sha256"])), "payload_sha256 is not a sha256")
          need(s("linker_commit") and bool(re.fullmatch(r"[0-9a-f]{40}", m["linker_commit"])), "linker_commit is not a 40-hex sha")
          need(m["linker_commit"] == os.environ["RUN_HEAD_SHA"], "linker_commit != the relink run's head_sha")
          need(type(m["relink_run_id"]) is int and m["relink_run_id"] == int(os.environ["EXP_RUN_ID"]), "relink_run_id != the dispatched run")
          need(type(m["relink_run_attempt"]) is int and m["relink_run_attempt"] > 0, "relink_run_attempt not a positive int")
          need(m["relink_run_attempt"] == int(os.environ["RUN_ATTEMPT"]), "relink_run_attempt != the relink run's attempt")
          need(s("engine_fingerprint") and bool(re.fullmatch(r"[\x20-\x7e]{1,4096}", m["engine_fingerprint"])), "engine_fingerprint must be a non-empty single-line printable-ASCII string")
          print(f"LINKER_PAYLOAD_SHA256={m['payload_sha256']}")
          print(f"LINKER_ENGINE_FINGERPRINT={m['engine_fingerprint']}")
          print(f"LINKER_RELINK_RUN_ID={m['relink_run_id']}")
          print(f"LINKER_COMMIT={m['linker_commit']}")
          print(f"LINKER_RELINK_RUN_ATTEMPT={m['relink_run_attempt']}")
          PY
          tar --use-compress-program=unzstd -xf build/linker/linker_links.zst -C build/linker
          if [ "$EXPECTED_LINKER_SNAPSHOT_ZST_SHA256" != "$SNAPSHOT_ZST_SHA256" ]; then
            # A recovery rebuild can differ bytewise only because the source importer
            # embeds textimages opportunistically. Compare all identities, context and
            # content against the exact original snapshot. The verifier allows only an
            # image-only URL/data-URI substitution on a line with zero Linker records.
            RECOVERY_COMPARE_DIR="$RUNNER_TEMP/relink-snapshot-compare-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            rm -rf "$RECOVERY_COMPARE_DIR"
            mkdir -p "$RECOVERY_COMPARE_DIR"
            trap 'rm -rf "$RECOVERY_COMPARE_DIR"' EXIT
            ORIGINAL_SNAPSHOT_ZST="$RECOVERY_COMPARE_DIR/original.db.zst"
            ORIGINAL_SNAPSHOT_DB="$RECOVERY_COMPARE_DIR/original.db"
            REBUILT_SNAPSHOT_DB="$RECOVERY_COMPARE_DIR/rebuilt.db"
            gh release download \
              "lines-snapshot-sha256-$EXPECTED_LINKER_SNAPSHOT_ZST_SHA256" \
              -R "$GITHUB_REPOSITORY" -p lines_snapshot.db.zst \
              -O "$ORIGINAL_SNAPSHOT_ZST"
            echo "$EXPECTED_LINKER_SNAPSHOT_ZST_SHA256  $ORIGINAL_SNAPSHOT_ZST" | sha256sum -c -
            unzstd -f "$ORIGINAL_SNAPSHOT_ZST" -o "$ORIGINAL_SNAPSHOT_DB"
            unzstd -f build/lines_snapshot.db.zst -o "$REBUILT_SNAPSHOT_DB"
            python3 .pipeline-control/.github/scripts/verify_relink_recovery_snapshot.py \
              --original "$ORIGINAL_SNAPSHOT_DB" \
              --rebuilt "$REBUILT_SNAPSHOT_DB" \
              --artifacts build/linker/artifacts \
              --payload-meta build/linker/meta.json \
              --baseline-manifest build/linker/line-baseline/manifest.json
            rm -rf "$RECOVERY_COMPARE_DIR"
            trap - EXIT
          fi
          gradle :sefariasqlite:generateLinkerLinks \
            -PseforimDb=$PWD/build/seforim.db \
            -PlinkerArtifacts=$PWD/build/linker/artifacts \
            -PlinkerSidecar=$PWD/build/linker_sidecar.tsv \
            -PlinkerStrict=true \
            --no-daemon --stacktrace

      # ─── QA gate on the full DB (§10) ──────────────────────────────────────
      # Runs after LINKER inject so the DB is complete. --require-all makes any
      # skipped check a hard failure (e.g. a missing metrics report), so a
      # release can never publish with §10.5 silently un-run. The metrics report
      # is emitted at the Sefaria stage; on the full DB check5 compares per-type
      # counts with ≥ semantics automatically (no --sefaria-stage — the DB has
      # also accumulated havrouta/otzaria/linker links by now).
      #
      # --expect-snapshot is intentionally not passed here: the independent
      # manualLinksCorpusTest has already locked the manual-link counts; these
      # DB checks derive their expected values from this pinned build's schemas.
      # python3 (stdlib only) is the runtime; verify it like the deps script does
      # for sqlite3, then fail the job on any nonzero exit.
      - name: QA — run §10 checks on the full DB (required)
        run: |
          set -euo pipefail
          command -v python3
          python3 scripts/qa/run_all.py \
            --db build/seforim.db \
            --sefaria-dir "$SEFARIA_EXTRACT_ROOT" \
            --metrics build/seforim.db.link-import-metrics.json \
            --require-all

      # ─── Produce log-fan of patches: offsets {1, 2, 4, 8, 16} ──────────────
      # The prev DB is reconstituted from the release's compressed seforim.db.zst.
      # Each iteration downloads + decompresses, runs the producer, then
      # frees everything so disk peak stays bounded.
      - name: Produce + verify patch fan
        if: steps.discover.outputs.has_prev == 'true'
        run: |
          set -euo pipefail
          # קורא db_schema_version מ-DB; טבלה/שורה חסרה → ERROR (release DB חייב מוטבע).
          # sqlite3 זמין ברנרים ה-self-hosted (בשימוש גם בוורקפלואי delta-real-diff-*).
          read_schema() {
            local db="$1" v
            if ! v=$(sqlite3 "$db" "SELECT value FROM schema_meta WHERE key='db_schema_version'" 2>/dev/null); then
              echo "::error::schema_meta missing/unreadable in $db (release DB must be stamped)" >&2
              return 1
            fi
            [ -n "$v" ] || { echo "::error::db_schema_version row missing in $db (release DB must be stamped)" >&2; return 1; }
            printf '%s' "$v"
          }
          THIS_VER=${{ steps.discover.outputs.db_version }}
          THIS_SCHEMA=$(read_schema build/seforim.db) || exit 1
          echo "THIS DB schema version = $THIS_SCHEMA"
          mkdir -p patches prev-dbs
          for OFFSET in $PATCH_OFFSETS; do
            TARGET_VER=$((THIS_VER - OFFSET))
            if [ "$TARGET_VER" -lt 1 ]; then
              echo "offset $OFFSET would target version $TARGET_VER (<1) — skip"
              continue
            fi
            TAG=$(awk -F'\t' -v v="$TARGET_VER" '$1==v{print $2; exit}' prior-versions.tsv || true)
            if [ -z "$TAG" ]; then
              echo "No prior release at db_version=$TARGET_VER (offset $OFFSET) — skip"
              continue
            fi
            echo "=== Producing patch v${TARGET_VER} → v${THIS_VER} (offset $OFFSET, tag=$TAG) ==="
            rm -rf prev-dbs
            mkdir -p prev-dbs
            gh release download "$TAG" \
              --pattern 'seforim.db.zst' \
              --dir prev-dbs
            unzstd -c prev-dbs/seforim.db.zst > prev-dbs/seforim.db
            PREV_DB=prev-dbs/seforim.db
            test -s "$PREV_DB" || { echo "::error::seforim.db.zst not found in release $TAG"; exit 1; }

            # אין patch חוצה-סכמה: אם הסכמה של ה-prev שונה — דלג על ה-anchor הזה בלבד
            # (פרסום ה-bundle המלא נמשך). schema_meta חסר → ERROR ב-read_schema.
            PREV_SCHEMA=$(read_schema "$PREV_DB") || exit 1
            if [ "$PREV_SCHEMA" != "$THIS_SCHEMA" ]; then
              echo "schema $PREV_SCHEMA != $THIS_SCHEMA — cross-schema delta unsupported, skip anchor"
              rm -rf prev-dbs
              continue
            fi

            gradle :generator-common:producePatchAndVerify \
              -PprevDb=$PWD/$PREV_DB \
              -PnewDb=$PWD/build/seforim.db \
              -Pout=$PWD/patches/patch-v${TARGET_VER}-v${THIS_VER}.db \
              -PfromVersion=$TARGET_VER -PtoVersion=$THIS_VER \
              --no-daemon --stacktrace

            # Free disk for the next iteration — only the .zst + manifest
            # need to ship; the .db was the verify ground-truth.
            rm -rf prev-dbs
            rm -f "patches/patch-v${TARGET_VER}-v${THIS_VER}.db" \
                  "patches/verify-patch-v${TARGET_VER}-v${THIS_VER}.db"
            df -h /
          done
          echo "=== Final patch artefacts ==="
          ls -lh patches/ || true

      # Compress the full DB into a single .zst for the release. Done after the
      # delta phase so build/seforim.db (the diff ground-truth) and the .zst
      # don't both sit on disk during the patch fan.
      - name: Compress Seforim Database (zstd)
        run: zstd -T0 -22 -f -o build/seforim.db.zst build/seforim.db

      # ─── Stage release assets ──────────────────────────────────────────────
      - name: Stage release assets
        env:
          CORRELATION_ID: ${{ inputs.correlation_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SEFARIA_TAG: ${{ inputs.sefaria_tag }}
          SEFARIA_METADATA_SHA: ${{ inputs.sefaria_release_metadata_sha256 }}
          SEFARIA_ARCHIVE_SHA: ${{ inputs.sefaria_archive_sha256 }}
          OTZARIA_TAG: ${{ inputs.otzaria_tag }}
          OTZARIA_ASSET_SHA: ${{ inputs.otzaria_asset_sha256 }}
          EXPECTED_LINKS_COMMIT: ${{ inputs.expected_links_commit }}
          OTZARIA_TARGET_COMMIT: ${{ inputs.otzaria_target_commit }}
          FORDB_ARCHIVE_SHA: ${{ inputs.fordb_archive_sha256 }}
          FORDB_TAG: ${{ inputs.fordb_tag }}
        run: |
          set -euo pipefail
          STAGE=release-staging
          mkdir -p "$STAGE"
          # Full DB, compressed — canonical source of the DB.
          # Future releases reconstitute the prev DB from this.
          cp build/seforim.db.zst "$STAGE/"
          cp build/seforim.db.buildstate "$STAGE/"
          # Lines snapshot for the linker (lineage + manual/standalone relink runs;
          # the serial cycle already handed it to relink through its content-addressed release).
          cp build/lines_snapshot.db.zst "$STAGE/"
          # Patch fan (zero or more files; only present from release #2 on).
          if compgen -G "patches/patch-*.db.zst" > /dev/null; then
            cp patches/patch-*.db.zst "$STAGE/"
            cp patches/patch-*.db.zst.manifest.json "$STAGE/"
          fi
          echo "Staged assets:"
          ls -lh "$STAGE/"
          # Sanity: every asset must fit GitHub's 2 GiB per-asset cap.
          MAX=2147483647
          OVER=$(find "$STAGE" -maxdepth 1 -type f -size +${MAX}c)
          if [ -n "$OVER" ]; then
            echo "::error::Asset(s) exceed GitHub's 2 GiB single-file limit:"
            ls -lh $OVER
            exit 1
          fi

          # Canonical, timestamp-free provenance. Asset hashes cover every
          # payload file; build_provenance.json itself is covered by the
          # release verification and pipeline result to avoid a hash cycle.
          python3 - "$STAGE" "$MANUAL_LINKS_LINEAGE" <<'PY'
          import hashlib, json, os, pathlib, sys
          stage, lineage_path = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          lineage = json.loads(lineage_path.read_text(encoding="utf-8"))
          def file_sha256(path):
              digest=hashlib.sha256()
              with path.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024*1024),b""): digest.update(chunk)
              return digest.hexdigest()
          assets = []
          for path in sorted(stage.iterdir(), key=lambda p: p.name.encode()):
              assets.append({"name": path.name, "size": path.stat().st_size, "sha256": file_sha256(path)})
          value = {
              "schema_version": 2,
              "correlation_id": os.environ["CORRELATION_ID"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "sefaria_tag": os.environ["SEFARIA_TAG"],
              "sefaria_release_metadata_sha256": os.environ["SEFARIA_METADATA_SHA"],
              "sefaria_archive_sha256": os.environ["SEFARIA_ARCHIVE_SHA"],
              "otzaria_tag": os.environ["OTZARIA_TAG"],
              "otzaria_asset_sha256": os.environ["OTZARIA_ASSET_SHA"],
              "fordb_archive_sha256": os.environ["FORDB_ARCHIVE_SHA"],
              "fordb_tag": os.environ["FORDB_TAG"],
              "expected_links_commit": os.environ["EXPECTED_LINKS_COMMIT"],
              "otzaria_target_commit": os.environ["OTZARIA_TARGET_COMMIT"],
              "linker_payload_sha256": os.environ["LINKER_PAYLOAD_SHA256"],
              "linker_engine_fingerprint": os.environ["LINKER_ENGINE_FINGERPRINT"],
              "linker_relink_run_id": int(os.environ["LINKER_RELINK_RUN_ID"]),
              "linker_commit": os.environ["LINKER_COMMIT"],
              "linker_relink_run_attempt": int(os.environ["LINKER_RELINK_RUN_ATTEMPT"]),
              "linker_relink_request_id": os.environ["RELINK_REQUEST_ID"],
              "lineage_sha256": hashlib.sha256(lineage_path.read_bytes()).hexdigest(),
              "config_sha256": lineage["config_sha256"],
              "source_links_tree_sha256": lineage["source_links_tree_sha256"],
              "packaged_links_tree_sha256": lineage["packaged_links_tree_sha256"],
              "assets": assets,
          }
          (stage / "build_provenance.json").write_text(
              json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          python3 .pipeline-control/.github/scripts/validate_build_provenance.py "$STAGE/build_provenance.json"

      - name: Create draft, verify every uploaded asset, then publish
        id: publish
        env:
          AUTOMATIC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROSS_REPO_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          use_token() {
            case "$1" in
              automatic)
                [ "$RELEASE_AUTOMATIC_WRITABLE" = true ] || return 1
                export GH_TOKEN="$AUTOMATIC_TOKEN"
                ;;
              cross-repo)
                [ "$RELEASE_CROSS_REPO_WRITABLE" = true ] || return 1
                export GH_TOKEN="$CROSS_REPO_TOKEN"
                ;;
              *) return 1 ;;
            esac
            CURRENT_TOKEN_KIND="$1"
          }
          switch_token() {
            case "$CURRENT_TOKEN_KIND" in
              automatic) use_token cross-repo ;;
              cross-repo) use_token automatic ;;
              *) return 1 ;;
            esac
          }
          use_token "$RELEASE_TOKEN_KIND" || {
            echo "::error::release credential preflight result is missing or invalid"
            exit 1
          }

          # Print absent, exact-empty-draft, or conflict. A response-lost create
          # is adopted only when every immutable field and the empty asset set
          # match this invocation; an unrelated release is never overwritten.
          release_state() {
            local output="$RUNNER_TEMP/release-state.json" error="$RUNNER_TEMP/release-state.err"
            if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$output" 2> "$error"; then
              if grep -q 'HTTP 404' "$error"; then echo absent; return 0; fi
              cat "$error" >&2
              return 1
            fi
            python3 - "$output" "$RELEASE_TAG" "$SOURCE_COMMIT" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding="utf-8"))
          exact=(
              value.get("tag_name")==sys.argv[2]
              and value.get("name")==sys.argv[2]
              and value.get("target_commitish")==sys.argv[3]
              and value.get("draft") is True
              and value.get("assets")==[]
          )
          print("exact-empty-draft" if exact else "conflict")
          PY
          }
          ensure_draft() {
            local state
            state=$(release_state) || return 1
            case "$state" in
              exact-empty-draft)
                echo "Adopting exact empty draft after a response-lost create."
                return 0
                ;;
              conflict)
                echo "::error::Release tag already exists with conflicting identity or assets."
                return 1
                ;;
              absent) ;;
              *) echo "::error::Unknown release state: $state"; return 1 ;;
            esac
            if gh release create "$RELEASE_TAG" --target "$SOURCE_COMMIT" --title "$RELEASE_TAG" --draft; then
              return 0
            fi
            echo "::warning::Release create failed with $CURRENT_TOKEN_KIND; reconciling before retry."
            state=$(release_state) || state=query-error
            [ "$state" != conflict ] || return 1
            if [ "$state" = exact-empty-draft ]; then return 0; fi
            switch_token || {
              echo "::error::No independently preflighted release credential remains."
              return 1
            }
            state=$(release_state) || return 1
            case "$state" in
              exact-empty-draft) return 0 ;;
              absent)
                if gh release create "$RELEASE_TAG" --target "$SOURCE_COMMIT" --title "$RELEASE_TAG" --draft; then
                  return 0
                fi
                state=$(release_state) || return 1
                [ "$state" = exact-empty-draft ]
                ;;
              *) echo "::error::Release tag is conflicting after credential fallback."; return 1 ;;
            esac
          }
          ensure_draft

          # Upload one asset at a time. If an upload response is lost, reconcile
          # by exact name+size+digest and continue. Never use --clobber.
          release_assets_json() {
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq \
              '{assets:[.assets[]|{name,size,digest}]}'
          }
          asset_state() {
            local asset_path="$1" expected_size="$2" expected_digest="$3"
            local output="$RUNNER_TEMP/release-assets-state.json"
            release_assets_json > "$output" || return 1
            python3 - "$output" "$asset_path" "$expected_size" "$expected_digest" <<'PY'
          import json,sys
          from pathlib import Path
          assets=json.load(open(sys.argv[1],encoding="utf-8"))["assets"]
          path=Path(sys.argv[2])
          matches=[item for item in assets if item.get("name")==path.name]
          if not matches:
              print("absent")
          elif len(matches)!=1:
              print("conflict")
          else:
              item=matches[0]
              if item.get("size")!=int(sys.argv[3]):
                  print("conflict")
              elif item.get("digest") in (None, ""):
                  print("pending")
              else:
                  print("exact" if item.get("digest")=="sha256:"+sys.argv[4] else "conflict")
          PY
          }
          upload_asset() {
            local asset_path="$1" expected_size expected_digest state attempt
            expected_size=$(stat --format='%s' "$asset_path")
            expected_digest=$(sha256sum "$asset_path" | cut -d ' ' -f1)
            state=$(asset_state "$asset_path" "$expected_size" "$expected_digest") || return 1
            case "$state" in
              exact) return 0 ;;
              conflict) echo "::error::Conflicting remote asset: ${asset_path##*/}"; return 1 ;;
              absent) ;;
              pending)
                for attempt in $(seq 1 12); do
                  sleep 5
                  state=$(asset_state "$asset_path" "$expected_size" "$expected_digest") || state=query-error
                  case "$state" in
                    exact) return 0 ;;
                    conflict|absent) return 1 ;;
                  esac
                done
                echo "::error::Digest metadata never settled for existing asset: ${asset_path##*/}"
                return 1
                ;;
              *) echo "::error::Unknown asset state: $state"; return 1 ;;
            esac
            if gh release upload "$RELEASE_TAG" "$asset_path"; then return 0; fi
            echo "::warning::Upload failed for ${asset_path##*/}; reconciling before retry."
            for attempt in $(seq 1 12); do
              state=$(asset_state "$asset_path" "$expected_size" "$expected_digest") || state=query-error
              case "$state" in
                exact) return 0 ;;
                conflict) return 1 ;;
              esac
              sleep 5
            done
            if [ "$state" = pending ]; then
              echo "::error::Refusing to duplicate an upload whose digest metadata is still pending: ${asset_path##*/}"
              return 1
            fi
            switch_token || return 1
            if gh release upload "$RELEASE_TAG" "$asset_path"; then return 0; fi
            for attempt in $(seq 1 6); do
              state=$(asset_state "$asset_path" "$expected_size" "$expected_digest") || state=query-error
              [ "$state" != conflict ] || return 1
              if [ "$state" = exact ]; then return 0; fi
              sleep 2
            done
            return 1
          }
          for asset_path in release-staging/*; do upload_asset "$asset_path"; done
          verify_remote() {
            release_assets_json > "$RUNNER_TEMP/release-assets.json"
            python3 - "$RUNNER_TEMP/release-assets.json" release-staging <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          remote=json.loads(Path(sys.argv[1]).read_text())["assets"]
          actual={item["name"]:(item["size"],item.get("digest")) for item in remote}
          root=Path(sys.argv[2])
          def file_sha256(path):
              digest=hashlib.sha256()
              with path.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024*1024),b""): digest.update(chunk)
              return digest.hexdigest()
          local={p.name:(p.stat().st_size,"sha256:"+file_sha256(p)) for p in root.iterdir() if p.is_file()}
          if actual!=local: raise SystemExit("remote release descriptors do not exactly match staged bytes")
          PY
          }
          verified=false
          for _ in $(seq 1 12); do
            if verify_remote; then verified=true; break; fi
            sleep 5  # asset digest metadata is briefly eventually consistent
          done
          [ "$verified" = true ] || { echo "::error::uploaded release descriptors never matched local bytes"; exit 1; }
          if ! gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"; then
            echo "::warning::Release publish failed with $CURRENT_TOKEN_KIND; retrying once before credential fallback."
            sleep 2
            if ! gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"; then
              echo "::warning::Release publish retry failed; using the other preflighted credential."
              switch_token
              gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
            fi
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/published-release.json"
          python3 - "$RUNNER_TEMP/published-release.json" "$RELEASE_TAG" "$SOURCE_COMMIT" "$PRERELEASE" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding="utf-8"))
          expected_prerelease=sys.argv[4].lower()=="true"
          if not (
              value.get("tag_name")==sys.argv[2]
              and value.get("name")==sys.argv[2]
              and value.get("target_commitish")==sys.argv[3]
              and value.get("draft") is False
              and value.get("prerelease") is expected_prerelease
          ):
              raise SystemExit("published release identity does not exactly match this build")
          PY
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Write exact child result
        env:
          RELEASE_TAG: ${{ steps.publish.outputs.release_tag }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SEFARIA_TAG: ${{ inputs.sefaria_tag }}
          SEFARIA_METADATA_SHA: ${{ inputs.sefaria_release_metadata_sha256 }}
          SEFARIA_ARCHIVE_SHA: ${{ inputs.sefaria_archive_sha256 }}
          OTZARIA_TAG: ${{ inputs.otzaria_tag }}
          OTZARIA_ASSET_SHA: ${{ inputs.otzaria_asset_sha256 }}
          EXPECTED_LINKS_COMMIT: ${{ inputs.expected_links_commit }}
          OTZARIA_TARGET_COMMIT: ${{ inputs.otzaria_target_commit }}
          FORDB_ARCHIVE_SHA: ${{ inputs.fordb_archive_sha256 }}
          FORDB_TAG: ${{ inputs.fordb_tag }}
        run: |
          set -euo pipefail
          mkdir -p pipeline-result
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          stage = pathlib.Path("release-staging")
          provenance_path = stage / "build_provenance.json"
          provenance = json.loads(provenance_path.read_text(encoding="utf-8"))
          def file_sha256(path):
              digest=hashlib.sha256()
              with path.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024*1024),b""): digest.update(chunk)
              return digest.hexdigest()
          assets = []
          for path in sorted(stage.iterdir(), key=lambda item: item.name.encode("utf-8")):
              assets.append({"name": path.name, "size": path.stat().st_size, "sha256": file_sha256(path)})
          value = {
              "schema_version": 1,
              "status": "published",
              "correlation_id": os.environ["CORRELATION_ID"],
              "child_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "child_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "source_commit": os.environ["SOURCE_COMMIT"],
              "sefaria_tag": os.environ["SEFARIA_TAG"],
              "sefaria_release_metadata_sha256": os.environ["SEFARIA_METADATA_SHA"],
              "sefaria_archive_sha256": os.environ["SEFARIA_ARCHIVE_SHA"],
              "otzaria_tag": os.environ["OTZARIA_TAG"],
              "otzaria_asset_sha256": os.environ["OTZARIA_ASSET_SHA"],
              "fordb_archive_sha256": os.environ["FORDB_ARCHIVE_SHA"],
              "fordb_tag": os.environ["FORDB_TAG"],
              "expected_links_commit": os.environ["EXPECTED_LINKS_COMMIT"],
              "otzaria_target_commit": os.environ["OTZARIA_TARGET_COMMIT"],
              "release_tag": os.environ["RELEASE_TAG"],
              "build_provenance_sha256": hashlib.sha256(provenance_path.read_bytes()).hexdigest(),
              "lineage_sha256": provenance["lineage_sha256"],
              "config_sha256": provenance["config_sha256"],
              "source_links_tree_sha256": provenance["source_links_tree_sha256"],
              "packaged_links_tree_sha256": provenance["packaged_links_tree_sha256"],
              "assets": assets,
          }
          pathlib.Path("pipeline-result/pipeline-result.json").write_text(
              json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          sha256sum pipeline-result/pipeline-result.json | cut -d' ' -f1 > pipeline-result/pipeline-result.sha256

      - name: Publish exact child result release
        run: >-
          bash .pipeline-control/.github/scripts/publish_release_handoff.sh
          "pipeline-result-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "Immutable Seforim pipeline result ${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          "$GITHUB_SHA" pipeline-result/pipeline-result.json pipeline-result/pipeline-result.sha256

      # Release the RAM tmpfs no matter how the job ended. By now assets are
      # already uploaded and staged on real disk, so discarding build/ is safe;
      # leaving the mount would pin ~GBs of RAM and trip the next run's sweep.
      - name: Release RAM-backed build dir (tmpfs)
        if: always()
        run: |
          BUILD="$GITHUB_WORKSPACE/build"
          if mountpoint -q "$BUILD"; then
            sudo umount "$BUILD" 2>/dev/null || sudo umount -l "$BUILD"
            echo "Unmounted tmpfs build dir; RAM released."
          else
            echo "No tmpfs mount to release."
          fi

      # The workspace persists between runs on this self-hosted runner and the next
      # run may be a week away — don't park multi-GB leftovers (release copies, prev
      # DBs from a mid-loop failure) on disk meanwhile. All of it is regenerated or
      # re-downloaded by the next run.
      - name: Clean run-scoped disk leftovers (workspace persists on self-hosted)
        if: always()
        run: rm -rf prev-dbs patches release-staging prior-versions.tsv

      # If this build ends while the relink it dispatched is still pending/running — the
      # build hit its own timeout while waiting, failed in Phase-2, or was cancelled —
      # cancel OUR child so it can't outlive us as an orphan holding the linker
      # host/session (its own ceiling is 8h). Identity is the per-attempt request id
      # stamped into both run-names: matching is FULL-title equality, so this attempt's
      # cleanup can never touch another attempt's (or any other) runs. Order: cancel the
      # kaggle-relink DISPATCHER first and wait (bounded) until it is terminal — its own
      # SIGTERM trap cancels a child it already queued — then cancel any relink worker,
      # then re-scan a bounded window for a child that appeared mid-sweep. Anything still
      # invisible is reaped by the failure-event-driven reconcile-pipeline
      # invocation (keyed on the same request id).
      # Best-effort: never fails the job, and runs after the result artifact upload.
      - name: Cancel any in-flight relink for this build (no orphaned linker run)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          set -uo pipefail
          # The identity vars exist only if the dispatch step ran (GITHUB_ENV) — before
          # that point there is nothing to clean.
          [ "${RELINK_DISPATCH_STARTED:-}" = 1 ] || {
            echo "this attempt never reached the relink dispatch boundary — nothing to clean."
            exit 0
          }
          [ -n "${RELINK_REQUEST_ID:-}" ] || { echo "dispatch boundary lacked a request id — nothing to clean."; exit 0; }
          : "${RELINK_TITLE:=}"
          : "${KAGGLE_TITLE:=}"
          export RELINK_TITLE KAGGLE_TITLE
          # Fully paginated REST per pre-terminal status — an old orphan can never be
          # pushed out of a "last N runs" window by fresh completed runs. QUERY_OK
          # tracks every listing: a failed scan must end in ORPHAN_INTENT for the
          # reconciler, never in a false "cleanup done".
          QUERY_OK=1
          list_live() {  # $1 workflow file, $2 exact title → space-joined live run ids
            local wf="$1" status rows out="" failed=0
            for status in requested waiting pending queued in_progress; do
              if ! rows=$(TITLE="$2" gh api --paginate -X GET "repos/Otzaria/LinkerToOtzaria/actions/workflows/$wf/runs" \
                -f status="$status" -f per_page=100 \
                --jq '.workflow_runs[] | select(.display_title == env.TITLE) | (.id|tostring)' 2>/dev/null); then
                failed=1
                continue
              fi
              [ -z "$rows" ] || out+="$rows"$'\n'
            done
            printf '%s' "$out" | awk 'NF && !seen[$0]++' | tr '\n' ' '
            return "$failed"
          }
          wait_terminal() {  # $1 run id — bounded wait for the cancel to actually land
            local status
            for _ in $(seq 1 18); do
              status=$(gh api "repos/Otzaria/LinkerToOtzaria/actions/runs/$1" --jq .status 2>/dev/null || echo unknown)
              [ "$status" = "completed" ] && return 0
              sleep 5
            done
            echo "::warning::run $1 is still not terminal after 90s"
          }
          cancel_live() {  # $1 workflow, $2 exact title
            local ids rid
            if ! ids=$(list_live "$1" "$2"); then
              QUERY_OK=0
              ids=""
            fi
            for rid in $ids; do
              echo "Cancelling in-flight $1 run $rid ($2)"
              gh run cancel "$rid" -R Otzaria/LinkerToOtzaria || true
              wait_terminal "$rid"
            done
          }
          scan_all() {
            local relink_ids="" kaggle_ids=""
            if ! relink_ids=$(list_live relink.yml "$RELINK_TITLE"); then QUERY_OK=0; relink_ids=""; fi
            if ! kaggle_ids=$(list_live kaggle-relink.yml "$KAGGLE_TITLE"); then QUERY_OK=0; kaggle_ids=""; fi
            LIVE="$relink_ids $kaggle_ids"
          }
          # Dispatcher first (it can spawn a child), waited to terminal; then the worker.
          cancel_live kaggle-relink.yml "$KAGGLE_TITLE"
          cancel_live relink.yml "$RELINK_TITLE"
          # Bounded re-scan: a dispatcher cancelled above may have created its child just
          # before dying, and the API lists new runs with a lag. Three short rounds.
          for _ in 1 2 3; do
            scan_all
            [ -z "${LIVE// /}" ] && break
            cancel_live kaggle-relink.yml "$KAGGLE_TITLE"
            cancel_live relink.yml "$RELINK_TITLE"
            sleep 10
          done
          scan_all
          if [ -n "${LIVE// /}" ]; then
            echo "::warning::ORPHAN_INTENT relink_request_id=$RELINK_REQUEST_ID runs='$LIVE' — cleanup could not terminate everything; the failure-event reconciler reaps by this request id."
          elif [ "$QUERY_OK" -ne 1 ]; then
            echo "::warning::ORPHAN_INTENT relink_request_id=$RELINK_REQUEST_ID query_ok=0 — one or more scans failed; a live run may be invisible. The failure-event reconciler reaps by this request id."
          else
            echo "relink orphan-cleanup done for request=$RELINK_REQUEST_ID."
          fi

      - name: Release cross-repo host lease after child cleanup
        if: always()
        run: |
          state="${HOST_LEASE_STATE:-$RUNNER_TEMP/host-lease.json}"
          if [ -f "$state" ]; then
            python3 .pipeline-control/.github/scripts/host_lease.py release --state "$state"
          else
            echo "No local host lease state."
          fi

  reuse-result:
    name: Return the already-published exact build
    needs: reconcile
    if: needs.reconcile.outputs.reuse == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pipeline handoff publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/scripts
          persist-credentials: false
      - name: Write exact child result
        env:
          CORRELATION_ID: ${{ inputs.correlation_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SEFARIA_TAG: ${{ inputs.sefaria_tag }}
          SEFARIA_METADATA_SHA: ${{ inputs.sefaria_release_metadata_sha256 }}
          SEFARIA_ARCHIVE_SHA: ${{ inputs.sefaria_archive_sha256 }}
          OTZARIA_TAG: ${{ inputs.otzaria_tag }}
          OTZARIA_ASSET_SHA: ${{ inputs.otzaria_asset_sha256 }}
          EXPECTED_LINKS_COMMIT: ${{ inputs.expected_links_commit }}
          OTZARIA_TARGET_COMMIT: ${{ inputs.otzaria_target_commit }}
          FORDB_ARCHIVE_SHA: ${{ inputs.fordb_archive_sha256 }}
          FORDB_TAG: ${{ inputs.fordb_tag }}
          RELEASE_TAG: ${{ needs.reconcile.outputs.release_tag }}
          BUILD_PROVENANCE_SHA: ${{ needs.reconcile.outputs.build_provenance_sha256 }}
          LINEAGE_SHA: ${{ needs.reconcile.outputs.lineage_sha256 }}
          CONFIG_SHA: ${{ needs.reconcile.outputs.config_sha256 }}
          SOURCE_TREE_SHA: ${{ needs.reconcile.outputs.source_links_tree_sha256 }}
          PACKAGED_TREE_SHA: ${{ needs.reconcile.outputs.packaged_links_tree_sha256 }}
          ASSETS_JSON: ${{ needs.reconcile.outputs.assets_json }}
        run: |
          set -euo pipefail
          mkdir -p pipeline-result
          python3 - <<'PY'
          import json, os, pathlib
          value = {
              "schema_version": 1,
              "status": "reused",
              "correlation_id": os.environ["CORRELATION_ID"],
              "child_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "child_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "source_commit": os.environ["SOURCE_COMMIT"],
              "sefaria_tag": os.environ["SEFARIA_TAG"],
              "sefaria_release_metadata_sha256": os.environ["SEFARIA_METADATA_SHA"],
              "sefaria_archive_sha256": os.environ["SEFARIA_ARCHIVE_SHA"],
              "otzaria_tag": os.environ["OTZARIA_TAG"],
              "otzaria_asset_sha256": os.environ["OTZARIA_ASSET_SHA"],
              "fordb_archive_sha256": os.environ["FORDB_ARCHIVE_SHA"],
              "fordb_tag": os.environ["FORDB_TAG"],
              "expected_links_commit": os.environ["EXPECTED_LINKS_COMMIT"],
              "otzaria_target_commit": os.environ["OTZARIA_TARGET_COMMIT"],
              "release_tag": os.environ["RELEASE_TAG"],
              "build_provenance_sha256": os.environ["BUILD_PROVENANCE_SHA"],
              "lineage_sha256": os.environ["LINEAGE_SHA"],
              "config_sha256": os.environ["CONFIG_SHA"],
              "source_links_tree_sha256": os.environ["SOURCE_TREE_SHA"],
              "packaged_links_tree_sha256": os.environ["PACKAGED_TREE_SHA"],
              "assets": json.loads(os.environ["ASSETS_JSON"]),
          }
          pathlib.Path("pipeline-result/pipeline-result.json").write_text(
              json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          sha256sum pipeline-result/pipeline-result.json | cut -d' ' -f1 > pipeline-result/pipeline-result.sha256
      - name: Publish exact reused child result release
        run: >-
          bash .github/scripts/publish_release_handoff.sh
          "pipeline-result-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "Immutable reused Seforim pipeline result ${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          "$GITHUB_SHA" pipeline-result/pipeline-result.json pipeline-result/pipeline-result.sha256

  saga-callback:
    name: Notify event-driven parent after exact result release exists
    needs: [build-and-release, reuse-result]
    if: ${{ always() && inputs.saga_run_id != '' && (needs.build-and-release.result == 'success' || needs.reuse-result.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch zero-trust lookup key
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          SAGA_RUN_ID: ${{ inputs.saga_run_id }}
          SAGA_RUN_ATTEMPT: ${{ inputs.saga_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$SAGA_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SAGA_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          payload="$(jq -cn --arg correlation_id "$CORRELATION_ID" \
            --argjson saga_run_id "$SAGA_RUN_ID" --argjson child_run_id "$GITHUB_RUN_ID" \
            --argjson saga_run_attempt "$SAGA_RUN_ATTEMPT" --argjson child_run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{event_type:"seforim-published",client_payload:{correlation_id:$correlation_id,saga_run_id:$saga_run_id,saga_run_attempt:$saga_run_attempt,child_run_id:$child_run_id,child_run_attempt:$child_run_attempt}}')"
          gh api repos/Otzaria/otzaria-library/dispatches --method POST --input - <<<"$payload"

  refresh-release-manifest:
    name: Refresh release-manifest.json after publish or verified reuse
    needs: [reconcile, build-and-release, reuse-result]
    if: >-
      always() && needs.reconcile.result == 'success' &&
      (needs.build-and-release.result == 'success' || needs.reuse-result.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: seforim-release-manifest-writer
      cancel-in-progress: false
      queue: max
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: otzaria
          fetch-depth: 0
          persist-credentials: false
      - name: Regenerate and push the release manifest
        run: |
          set -euo pipefail
          if LATEST_JSON=$(gh release view --json tagName,name,publishedAt,assets 2>/dev/null | jq -cS 'del(.assets[].downloadCount)'); then
            LATEST_ARG=(--argjson latest "$LATEST_JSON")
          else
            LATEST_ARG=(--argjson latest null)
          fi
          ALL_RELEASES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select((.draft|not) and (.prerelease|not)) | {tagName:.tag_name,name:.name,publishedAt:.published_at} | @json' \
            | jq -sc '.')
          # Derive the timestamp from immutable release state.  A verified reuse
          # must regenerate the same bytes instead of committing a wall-clock-only
          # change every time the parent pipeline is retried.
          GENERATED_AT=$(jq -r '[.[].publishedAt | select(. != null)] | max // "1970-01-01T00:00:00Z"' <<<"$ALL_RELEASES")
          jq -n \
            --arg generatedAt "$GENERATED_AT" \
            "${LATEST_ARG[@]}" \
            --argjson releases "$ALL_RELEASES" \
            '{generatedAt: $generatedAt, latest: $latest, releases: $releases}' \
            > release-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add release-manifest.json
          if ! git diff --staged --quiet; then
            git commit -m "Update release manifest [skip ci]"
            git pull --rebase origin otzaria
            gh auth setup-git
            git push origin HEAD:otzaria
          fi
