name: Update Release Manifest

on:
  push:
    branches: [otzaria]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    name: Generate release assets JSON
    # Publishing an internal handoff pre-release must not start a manifest job.
    if: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    concurrency:
      group: seforim-release-manifest-writer
      cancel-in-progress: false
      queue: max
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: otzaria

      - name: Generate release manifest JSON
        run: |
          set -euo pipefail

          echo "Fetching all releases..."

          # `gh release view` (no args) → the "Latest" release. With no releases
          # (or only pre-releases) the call 404s and `latest` is legitimately
          # null. Any OTHER failure — auth, rate limit, network, a broken jq — is
          # not, and `2>/dev/null` used to write the same silent null for it and
          # still report success, publishing a manifest that tells every client
          # there is no release. Keep stderr and tell the two cases apart.
          # Download counters change merely because a client (or the reuse
          # verifier) reads an asset.  They are monitoring data, not release
          # identity, so keep them out of the committed immutable manifest.
          LATEST_ERR="$RUNNER_TEMP/gh-release-view.err"
          if LATEST_RAW=$(gh release view --json tagName,name,publishedAt,assets 2>"$LATEST_ERR"); then
            LATEST_JSON=$(jq -cS 'del(.assets[].downloadCount)' <<<"$LATEST_RAW")
            LATEST_ARG=(--argjson latest "$LATEST_JSON")
            echo "manifest: latest release $(jq -r .tagName <<<"$LATEST_JSON")"
          elif grep -qEi 'release not found|404: not found \(https://api\.github\.com/repos/[^)]*/releases' "$LATEST_ERR"; then
            echo "manifest: no release published yet (gh reported 404) — writing latest: null"
            LATEST_ARG=(--argjson latest null)
          else
            echo "::error::gh release view failed for $GITHUB_REPOSITORY, refusing to publish a manifest that claims there is no release: $(tr '\n' ' ' < "$LATEST_ERR")"
            exit 1
          fi

          # Every final published DB release for history ([] when none exist),
          # fully paginated so a long-lived repository never truncates its
          # manifest. Workflow handoffs are pre-releases and stay out of the
          # user-facing database history.
          ALL_RELEASES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select((.draft|not) and (.prerelease|not)) | {tagName:.tag_name,name:.name,publishedAt:.published_at} | @json' \
            | jq -sc '.')

          GENERATED_AT=$(jq -r '[.[].publishedAt | select(. != null)] | max // "1970-01-01T00:00:00Z"' <<<"$ALL_RELEASES")

          jq -n \
             --arg generatedAt "$GENERATED_AT" \
             "${LATEST_ARG[@]}" \
             --argjson releases "$ALL_RELEASES" \
             '{generatedAt: $generatedAt, latest: $latest, releases: $releases}' \
             > release-manifest.json

          echo "Generated release-manifest.json:"
          cat release-manifest.json

      - name: Commit and push manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add release-manifest.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update release manifest [skip ci]"
            git pull --rebase origin otzaria
            git push origin HEAD:otzaria
          fi
