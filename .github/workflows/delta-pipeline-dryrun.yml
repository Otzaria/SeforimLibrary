name: Delta pipeline — dry run

# Smoke test of the full delta-update pipeline on the NEWEST published sources —
# what the next DB release will consume — WITHOUT publishing anything. It builds
# the database twice from that one snapshot and validates that:
#   - generateSeforimDb still works end to end on today's content
#   - stampSchemaVersion is correctly chained (schema_meta.db_version)
#   - the v1 buildstate properly seeds v2's IdAllocator (ID stability)
#   - producePatchAndVerify's strict `prev + patch == new` invariant holds
#
# The pipeline itself lives in delta-real-diff-test.yml; this file is the entry
# point that runs it with inputs_from=latest. It used to carry its own copy,
# which had no GH_TOKEN at all — every GitHub call the generator makes
# (OptimizedHttpClient.kt:49) went out unauthenticated at 60 requests/hour per
# runner IP — and it had never been dispatched once.
#
# Trigger: manual only, and deliberately so. One run is two full DB builds
# (~6 h) on the self-hosted runner the weekly release needs, and it does not
# hold the release's cross-repo host lease, so an unattended `schedule` could
# take that runner out from under a release. Press it before merging anything
# that touches the generator, the patch producer or the ForDB rules.
#
# All artefacts are uploaded as workflow artefacts. Nothing is pushed to a
# GitHub Release.

on:
  workflow_dispatch:
    inputs:
      runner_selection:
        description: 'בחר על איזה שרת להריץ את הבדיקה'
        required: true
        default: 'local'
        type: choice
        options:
          - 'local'
          - 'ARM64'
          - 'server-2'

permissions:
  contents: read

# The concurrency group lives on delta-real-diff-test.yml, the workflow this one
# calls: a caller that held the same group would be waiting on its own job.

jobs:
  dryrun:
    uses: ./.github/workflows/delta-real-diff-test.yml
    with:
      runner_selection: ${{ inputs.runner_selection }}
      inputs_from: latest
