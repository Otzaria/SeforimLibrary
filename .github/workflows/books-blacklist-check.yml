name: Books blacklist check

# Weekly: every line of books_blacklist.txt must still match a book in the
# SefariaExport the next build imports, and in live Sefaria. A line that stops
# matching blocks nothing, silently. Certain fixes are committed to the trunk;
# the rest go to an issue with suggestions, and the run fails.
# See .github/scripts/blacklist/books_blacklist_check.py.

on:
  schedule:
    # Wednesday 12:00 Israel time. Cron is UTC and Israel moves between +3
    # (summer) and +2 (winter), so both fire and the gate below keeps the one
    # that is noon today.
    - cron: '0 9 * * 3'
    - cron: '0 10 * * 3'
  workflow_dispatch:
    inputs:
      fix:
        description: Commit the certain fixes and open/update the issue
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: books-blacklist-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: 'Books blacklist: lines that block nothing'

    steps:
      - name: Keep only the noon run
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          offset="$(TZ=Asia/Jerusalem date +%z)"
          run=false
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            run=true
          elif [ "$SCHEDULE" = "0 9 * * 3" ] && [ "$offset" = "+0300" ]; then
            run=true
          elif [ "$SCHEDULE" = "0 10 * * 3" ] && [ "$offset" = "+0200" ]; then
            run=true
          fi
          echo "Israel offset $offset, schedule '${SCHEDULE:-none}': run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Checkout source
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          ref: otzaria

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Test the checker
        if: steps.gate.outputs.run == 'true'
        run: python .github/scripts/blacklist/test_books_blacklist_check.py

      - name: Check the blacklist
        id: check
        if: steps.gate.outputs.run == 'true'
        env:
          FIX: ${{ github.event_name == 'schedule' || inputs.fix }}
        run: |
          set -uo pipefail
          args=(--report "$RUNNER_TEMP/report.md")
          [ "$FIX" = "true" ] && args+=(--fix)
          python .github/scripts/blacklist/books_blacklist_check.py "${args[@]}"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ -f "$RUNNER_TEMP/report.md" ] && cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          # 2 = a title source was unreachable: nothing was judged or written.
          [ "$rc" -eq 2 ] && exit 2
          exit 0

      - name: Commit the certain fixes
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator/sefariasqlite/src/jvmMain/resources/books_blacklist.txt \
                  .github/scripts/blacklist/books_blacklist_titles.tsv
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          {
            echo "Books blacklist: follow Sefaria title changes"
            echo
            sed -n '/^### Fixed/,/^### /p' "$RUNNER_TEMP/report.md" | grep '^- ' || echo "- refresh the title lock"
          } > "$RUNNER_TEMP/message.txt"
          git commit -F "$RUNNER_TEMP/message.txt"
          git pull --rebase origin otzaria
          git push origin HEAD:otzaria

      - name: Open, update or close the issue
        if: steps.check.outputs.rc == '0' || steps.check.outputs.rc == '1'
        env:
          FIX: ${{ github.event_name == 'schedule' || inputs.fix }}
          RC: ${{ steps.check.outputs.rc }}
        run: |
          set -euo pipefail
          [ "$FIX" = "true" ] || { echo "Report-only run: issue left alone"; exit 0; }
          number="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$ISSUE_TITLE\" in:title" \
            --json number,title --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$RC" = "1" ]; then
            { cat "$RUNNER_TEMP/report.md"; echo; echo "Run: $run_url"
              echo; echo "Fix the lines in \`generator/sefariasqlite/src/jvmMain/resources/books_blacklist.txt\`; the next run closes this issue."
            } > "$RUNNER_TEMP/issue.md"
            if [ -n "$number" ]; then
              gh issue edit "$number" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
            else
              gh issue create -R "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/issue.md"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" -R "$GITHUB_REPOSITORY" --comment "All lines match a book again ($run_url)."
          fi

      - name: Fail while lines need a decision
        if: steps.check.outputs.rc == '1'
        run: |
          echo "::error::${{ steps.check.outputs.unresolved }} blacklist line(s) match no book; suggestions are in the job summary and the issue"
          exit 1
